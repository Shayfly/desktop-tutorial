name: a2-offline

# A2 (Gemini) 1.1-1.3 offline (docs/spec/gemini-a2.md section 6): search, verify and capture in a real Chromium
# against sites served from the runner itself. Every request to another host is aborted by the session and counted;
# no secrets, no provider calls, no network beyond installing packages. A missing browser FAILS the job
# (A2_REQUIRE_BROWSER=1) and a skipped test fails it too -- a skipped check is never a pass.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  a2-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      A2_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-test.txt playwright==1.63.0
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            if timeout 160 python -m playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; the A2 browser tests cannot run"
          exit 1
      - name: A2 offline tests
        timeout-minutes: 5
        run: python -m pytest -q -rs --junitxml=a2.xml tests/test_a2_collect.py
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('a2.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=a2-offline::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (A2)
        if: always()
        timeout-minutes: 5
        env:
          NC_ENV: a2
        run: python scripts/run_negative_controls.py a2_collect
      # step 5 (extraction): its own run and its own no-skip check, so the lines above stay as they were
      - name: A2 extraction tests
        if: always()
        timeout-minutes: 5
        run: python -m pytest -q -rs --junitxml=a2x.xml tests/test_a2_extract.py
      - name: No extraction test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('a2x.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=a2-extract::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (A2 extraction)
        if: always()
        timeout-minutes: 5
        env:
          NC_ENV: a2
        run: python scripts/run_negative_controls.py a2_extract
      # 109 / 110 (the owner, 2026-11-15 23:26): no style of its own is not a card; every field says who set it
      - name: Negative controls (A2 styles 109/110)
        if: always()
        timeout-minutes: 5
        env:
          NC_ENV: a2
        run: python scripts/run_negative_controls.py a2_styles
