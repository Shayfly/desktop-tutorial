name: agent loop
on:
  # Second, idempotent trigger. The primary one is the repo-control service, which dispatches this workflow every
  # 15 minutes (GitHub's schedule fired once in ten hours). Off the crowded :00/:15/:30/:45 minutes.
  schedule:
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
# The service trigger and GitHub's schedule never run retarget/sweep at the same time; nothing is cancelled.
concurrency:
  group: agent-loop
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  loop:
    runs-on: ubuntu-latest
    env:
      SERVICE_TOKEN: ${{ secrets.SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: stall check (no "silent green")
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          last=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/agent-loop.yml/runs?status=success&per_page=1" \
                 -q '.workflow_runs[0].updated_at' 2>/dev/null || true)
          if [[ -z "$last" || "$last" == "null" ]]; then
            echo "::warning title=agent-loop STALLED::no successful agent-loop run on record"
          else
            age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
            if (( age > 2700 )); then
              echo "::warning title=agent-loop STALLED::last successful run was $(( age / 60 )) minutes ago ($last); expected every 15 minutes"
            else
              echo "::notice title=agent-loop trigger::event=${GITHUB_EVENT_NAME} actor=${GITHUB_ACTOR}; last success $(( age / 60 )) min ago"
            fi
          fi
      - name: retarget stale bases
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SERVICE_TOKEN" ]]; then
            printf '### retarget: FAIL\nSERVICE_TOKEN is empty\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          if ! curl --fail-with-body -sS --max-time 150 "https://one48ai-repo-control.onrender.com/pr?op=retarget&token=$SERVICE_TOKEN" > "$response"; then
            printf '### retarget: FAIL\nHTTP/transport failure\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python scripts/check_agent_loop_result.py retarget < "$response"
      - name: sweep clean ready
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          if ! curl --fail-with-body -sS --max-time 200 "https://one48ai-repo-control.onrender.com/pr?op=sweep&token=$SERVICE_TOKEN" > "$response"; then
            printf '### sweep: FAIL\nHTTP/transport failure\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python scripts/check_agent_loop_result.py sweep < "$response"
