name: browser-python

# The Python checks that need a real Chromium (2026-11-21, the review of the content-document route): the section
# library's production visual check (tests/test_section_library.py) and the content route through the real
# verification chain (tests/test_site_content_engine.py). v24-ci's test and negative-controls jobs install no Python
# playwright, so these tests skip there and the browser-only negative controls cannot run. Here a missing browser
# FAILS the job and a skipped test fails it too -- a skipped check is never a pass. The section library's controls run
# with NC_ENV=browser, so its browser-only controls (envs: browser) run here and nowhere else.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-python:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt playwright==1.63.0
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          # the same bounded install as a2-offline: apt waits for the dpkg lock inside one attempt (#449)
          echo 'DPkg::Lock::Timeout "150";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-dpkg-lock >/dev/null
          for attempt in 1 2 3; do
            if timeout 160 python -m playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; the browser tests cannot run"
          exit 1
      - name: Browser tests
        timeout-minutes: 4
        # 2026-11-22 (warehouse 126): the font pairs load in a real browser, and the owner's brief builds READY through the
        # real chain with its pair; both files skip without Chromium, so they run here.
        run: >-
          python -m pytest -q -rs --junitxml=browser.xml tests/test_section_library.py
          tests/test_section_library_conformance.py tests/test_site_content_engine.py tests/test_library_cookie_banner.py
          tests/test_font_pairs_load.py tests/test_font_pair_on_the_real_chain.py
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('browser.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=browser-python::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (browser)
        if: always()
        # 2026-11-21 (run 44954125388): 24 controls since the library merge; 21 ran and passed in 6 minutes and the
        # step was cut at its limit. Measured there: about 16 s a control with 2 workers, so 24 need about 6.5 minutes.
        # 2026-11-27 (run 45982884969, #549): every control passed and the step was cut at 13 minutes. Measured there:
        # all 41 controls PASS in about 13.5 minutes (section_library alone about 11 minutes, 24/24; then
        # library_cookie_banner 9/9, typography 4/4, repair_converge_offscreen 4/4), so the limit is 20 (the job's 27
        # became 34: 9 + 4 + 20 + 1). No control and no NC_JOBS value changed.
        timeout-minutes: 20
        env:
          NC_ENV: browser
          NC_JOBS: "2"
        # 2026-11-22: the library's cookie banner (DECISIONS 14 b) has 3 browser-only controls of its own (NC7-NC9)
        # 2026-11-22 (warehouse 126): of typography_126_129 only the 4 controls that need a browser run here
        # (NC4/NC5 envs browser, NC1/NC16 expect_failed_browser); the other 12 run in v24-ci.
        run: |
          python scripts/run_negative_controls.py section_library; a=$?
          python scripts/run_negative_controls.py library_cookie_banner; b=$?
          NC_SCOPE=declared python scripts/run_negative_controls.py typography_126_129; c=$?
          # 2026-11-26 (#541, run 45855426699): NC1-NC3 and NC6 of repair_converge_offscreen drive Chromium (visual_qa's
          # viewport and widening-element tests, the focused skip link); v24-ci's shards have none, so they were DID NOT
          # RUN there. envs browser now: they run here, inside this step's 13 min, on ONE worker: tests/test_visual_qa.py
          # starts its pages on fixed ports (18731-18739), so two controls of this spec at once refuse each other's page
          # (run 45860673027: ERR_CONNECTION_REFUSED at 127.0.0.1:18733, an extra failure under NC6).
          # 2026-11-26: test_visual_qa now takes a free port per page (_free_port), so the spec runs on the step's 2 workers again
          # (NC_JOBS=1 made this step slower; #545's run timed out at the 13-minute step limit).
          NC_SCOPE=declared python scripts/run_negative_controls.py repair_converge_offscreen; d=$?
          c=$(( c | d ))
          b=$(( b | c ))
          exit $(( a | b ))

  # Warehouse 134 (2026-11-23): the 2D games are played in real Chromium -- four samples at a computer's and a phone's
  # width, six planted faults (tests/test_game_kit.py) and the game kit's browser-only controls. A job of its own:
  # browser-python's steps already fill its 27-minute cap (measured on main: browser tests 181 s of 240, controls
  # 614 s of 780). Locally the tests take about 45 s and the 7 browser controls about 2 minutes. A skip fails here too.
  game-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt playwright==1.63.0
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          echo 'DPkg::Lock::Timeout "150";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-dpkg-lock >/dev/null
          for attempt in 1 2 3; do
            if timeout 160 python -m playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; the game tests cannot run"
          exit 1
      - name: Game tests
        timeout-minutes: 4
        run: python -m pytest -q -rs --junitxml=games.xml tests/test_game_kit.py
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('games.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=game-kit::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (browser)
        if: always()
        timeout-minutes: 5
        env:
          NC_ENV: browser
          NC_JOBS: "2"
        run: python scripts/run_negative_controls.py game_kit

  # Warehouse 127 (2026-11-28, #568, run 46162357695): the legal page's real chain (tests/test_domain_legal_chain_127.py)
  # drives Chromium through the fixed server of a real build, so it skips in v24-ci, whose shard 1 then reported its
  # two controls DID NOT RUN. A job of its own: browser-python's step limits already fill its 34-minute cap (browser
  # tests 221 s of 240 on run 46161200611). Measured locally: 2 tests in 72 s; the 2 controls in about 3 minutes.
  legal-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt playwright==1.63.0
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          echo 'DPkg::Lock::Timeout "150";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-dpkg-lock >/dev/null
          for attempt in 1 2 3; do
            if timeout 160 python -m playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; the legal-chain tests cannot run"
          exit 1
      - name: Legal-chain tests
        timeout-minutes: 4
        run: python -m pytest -q -rs --junitxml=legal.xml tests/test_domain_legal_chain_127.py
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('legal.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=legal-chain::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (browser)
        if: always()
        timeout-minutes: 6
        env:
          NC_ENV: browser
          NC_JOBS: "2"
        run: NC_SCOPE=declared python scripts/run_negative_controls.py domain_legal_chain_127

  # The owner, 2026-11-25 (the font question, "א. צריך שיהיה את כל המגוון"): the font-pair library's full range is
  # checked live -- the licences, scripts and weights Google Fonts states today for every family on the allowed list,
  # and every Hebrew pair on the section library's page in real Chromium (no sideways scroll, every heading inside its
  # box at 320-1440 px, both faces loaded) -- with the font range's browser-only controls. A job of its own:
  # browser-python's steps already fill its 27-minute cap. Locally the tests take about 40 s. A skip fails here too.
  font-range:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt playwright==1.63.0
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          echo 'DPkg::Lock::Timeout "150";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-dpkg-lock >/dev/null
          for attempt in 1 2 3; do
            if timeout 160 python -m playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; the font tests cannot run"
          exit 1
      - name: Font range tests
        timeout-minutes: 4
        run: python -m pytest -q -rs --junitxml=fonts.xml tests/test_font_pair_range_live.py
      # F2: upstream differences that break no page of ours are notices, written by the live test (NOTICES_FILE)
      - name: Upstream differences (notices)
        if: always()
        run: |
          if [ -f font-range-notices.txt ]; then
            echo "::notice title=font-range upstream::$(wc -l < font-range-notices.txt) difference(s) that break no page"
            cat font-range-notices.txt
          else
            echo "::notice title=font-range upstream::no notices file: the live comparison did not reach its end"
          fi
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('fonts.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          failed = [f"{c.get('classname')}.{c.get('name')}" for c in cases
                    if c.find('failure') is not None or c.find('error') is not None]
          print(f'::notice title=font-range::{len(cases)} test cases, {len(failed)} failed, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          for f in failed:
              print(f'::notice title=failed test::{f}')
          sys.exit(1 if skipped or failed or not cases else 0)
          PY
      - name: Negative controls (browser)
        if: always()
        timeout-minutes: 6
        env:
          NC_ENV: browser
          NC_JOBS: "2"
        run: NC_SCOPE=declared python scripts/run_negative_controls.py font_range
