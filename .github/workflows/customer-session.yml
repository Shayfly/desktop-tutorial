name: Customer session

# Warehouse 107 (owner 2026-11-16): a non-founder customer session is checked against production every day. Preferred
# (2026-11-21): the check logs in by itself with the secrets CUSTOMER_TEST_EMAIL and CUSTOMER_TEST_PASSWORD (a stored
# session expires after 7 days). Otherwise the stored session (secret CUSTOMER_STORAGE_STATE) is checked
# against production every day. A missing secret, a 401 or the founder's account fails the job with a readable
# ::error -- never a skip (scripts/customer_session_check.py, tests/test_ci_customer_session.py).

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read

concurrency:
  group: customer-session
  cancel-in-progress: false

jobs:
  customer-session:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Load the customer session and check it on production
        env:
          BASE_URL: https://148aiv28.vercel.app
          CUSTOMER_STORAGE_STATE: ${{ secrets.CUSTOMER_STORAGE_STATE }}
          CUSTOMER_TEST_EMAIL: ${{ secrets.CUSTOMER_TEST_EMAIL }}
          CUSTOMER_TEST_PASSWORD: ${{ secrets.CUSTOMER_TEST_PASSWORD }}
        run: python3 scripts/customer_session_check.py
