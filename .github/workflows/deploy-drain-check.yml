name: Deploy drain check

# Proves that a worker deploy waits for a running job (directive 2026-10-09 §18)
# at no model cost: it puts one harmless job -- time.sleep(N) -- on the build
# queue. Push a worker change while it runs; the deploy's "drain" notice and the
# worker log must show the job finishing ("Job OK") before the worker is
# replaced. Writes nothing but that one queue entry. A real build queued
# meanwhile waits up to N seconds.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Sleep length in seconds (30-600)
        required: true
        default: "180"

concurrency:
  group: deploy-drain-check
  cancel-in-progress: false

jobs:
  enqueue:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 5
    steps:
      - name: Enqueue one sleep job on the build queue
        working-directory: /home/omni/actions-runner/_work/desktop-tutorial/desktop-tutorial/infra/worker-host
        env:
          SECONDS_INPUT: ${{ inputs.seconds }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          s="${SECONDS_INPUT}"; case "$s" in ''|*[!0-9]*) echo "::error::seconds must be a number"; exit 1;; esac
          [ "$s" -ge 30 ] && [ "$s" -le 600 ] || { echo "::error::seconds must be 30-600"; exit 1; }
          docker compose exec -T -e S="$s" -e JOB="drain-check-$RUN_ID" worker python - <<'PY'
          import os
          from redis import Redis
          from rq import Queue
          s = int(os.environ["S"])
          q = Queue("omni-builds", connection=Redis.from_url(os.environ["OMNI_REDIS_URL"]))
          job = q.enqueue("time.sleep", s, job_id=os.environ["JOB"], job_timeout=s + 60, result_ttl=3600)
          print(f"::notice title=drain check::enqueued {job.id}: time.sleep({s}) on omni-builds")
          PY
