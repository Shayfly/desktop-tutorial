name: Deploy build worker

# Runs ON the worker host (self-hosted runner, label omni-worker), so no SSH
# keys or inbound ports are needed. Secrets never appear in logs: the env file
# is written with mode 600 and only variable NAMES are printed.
on:
  workflow_dispatch:
    inputs:
      deploy_ref:
        description: "Optional source branch/ref to deploy; empty uses the branch selected in Run workflow."
        required: false
        type: string
        default: ""
      accept_newer_migrations:
        description: "Code ROLLBACK only: exact migration versions a newer release already applied, e.g. 38 (comma separated). Empty = normal strict check."
        required: false
        default: ""
      mode:
        description: "deploy (default) or drill: on the DEPLOYED code, kill the build worker mid-build and prove exactly-once recovery, then restore the snapshot images with recover.sh and roll forward again. No checkout, no build, no migration."
        required: false
        type: choice
        options: [deploy, drill]
        default: deploy
  push:
    # The private candidate is deployed to the EXISTING Oracle staging host,
    # not to main or a customer production environment.
    branches: [milestone/pre-staging-2026-10-05, codex/148ai-verified-intake-2026-10-12]
    paths:
      - omni_prod/**
      - infra/worker-host/**
      - infra/sandbox/**
      - infra/sandbox-runner/**
      - infra/browser-sandbox/**
      - infra/postgres/**
      - requirements-production.txt
      - Dockerfile
      - .github/workflows/deploy-worker.yml

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'drill'
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 60
    steps:
      - name: Refuse ambiguous or staging-default deployment
        env:
          DEPLOY_REF: ${{ github.event.inputs.deploy_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ -z "${DEPLOY_REF}" ]; then
            echo "::error::No deployment ref selected"; exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = workflow_dispatch ] && [ "${DEPLOY_REF}" != main ]; then
            echo "::error::Manual deployments for this experiment must use main, not staging"; exit 1
          fi
          echo "::notice title=deployment-source::source_ref=${DEPLOY_REF}"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.deploy_ref || github.ref_name }}
          persist-credentials: false

      - name: Assert checked-out source revision
        env:
          DEPLOY_REF: ${{ github.event.inputs.deploy_ref || github.ref_name }}
        run: |
          set -euo pipefail
          echo "::notice title=deployment-revision::ref=${DEPLOY_REF} sha=$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "${DEPLOY_REF}" || {
            echo "::error::checkout branch does not match selected deployment ref"; exit 1; }

      - name: Write environment file
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          WORKER_ENV_OVERRIDES: ${{ secrets.WORKER_ENV_OVERRIDES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VENICE_API_KEY1: ${{ secrets.VENICE_API_KEY1 }}
          OMNI_DATABASE_URL: ${{ secrets.OMNI_DATABASE_URL }}
        run: bash infra/worker-host/write-env.sh

      - name: Confirm deployment scope and configured intake mode
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          grep -qx 'OMNI_ENV=staging' .env || {
            echo "::error title=Prototype staging only::This source revision must not deploy onto non-staging worker"; exit 1; }
          grep -qx 'OMNI_INTAKE_MODEL=1' .env || {
            echo "::error title=Intake disabled::Cannot replace intake worker with a disabled model mode"; exit 1; }
          # Capture first, then search: `docker compose config --services | grep -qx worker` under pipefail exited 255
          # in 15 of 300 runs on the host (grep -q stops reading at the first match, compose gets SIGPIPE, docker
          # reports 255) -- the step-4 flake of runs 39275019633, 39295236360, 39318357566 (probe 39318597963).
          services=$(docker compose config --services)
          grep -qx worker <<<"$services"
          grep -qx intake-worker <<<"$services"
          echo "::notice title=Staging::Releasing tested candidate; founder AI intake remains enabled"

      # 2026-10-19: `docker compose build` moves the compose tags and the running containers' image objects then
      # disappear, so the drain could no longer save a rollback image (run 39262167302). Snapshot every running
      # consumer as omni-rollback/<svc>:prev FIRST: tag -> commit -> rebuild from the running container's revision
      # (accepted only if 3 code hashes match). Stops nothing; idempotent.
      - name: Snapshot running consumers as rollback images (before the build)
        run: bash infra/worker-host/snapshot-rollback.sh

      - name: Build images
        # Bound image preparation before any worker drain or service replacement.
        timeout-minutes: 20
        working-directory: infra/worker-host
        run: docker compose build

      # Previews (M3): the preview worker's workdir must exist at the same
      # path on the host; the public edge (Caddy) needs TCP 80/443 open in the
      # host firewall (ufw from bootstrap.sh, plus the image's iptables rules).
      # The cloud security list is opened separately in the Oracle console.
      # Idempotent; prints the resulting INPUT rules for the record.
      - name: Prepare preview host
        run: |
          set -euo pipefail
          docker run --rm --privileged --net=host --pid=host -v /:/host alpine:3 chroot /host /bin/sh -c '
            set -e
            mkdir -p /var/lib/omni-preview/tmp && chmod 755 /var/lib/omni-preview && chmod 1777 /var/lib/omni-preview/tmp
            if command -v ufw >/dev/null && ufw status | grep -q "Status: active"; then ufw allow 80/tcp >/dev/null; ufw allow 443/tcp >/dev/null; fi
            for p in 80 443; do
              iptables -C INPUT -p tcp --dport $p -j ACCEPT 2>/dev/null || iptables -I INPUT 1 -p tcp --dport $p -j ACCEPT
            done
            command -v netfilter-persistent >/dev/null && netfilter-persistent save >/dev/null 2>&1 || true
            echo "INPUT rules for 80/443:"; iptables -S INPUT | grep -E "dport (80|443)" || true'
          docker pull -q python:3.11-slim
          docker pull -q node:20-slim

      # Golden E2E #1 reached artifact upload twice and failed on R2 (key length,
      # then SignatureDoesNotMatch) after minutes of paid generation. This writes,
      # reads back and deletes one small object through the same S3ArtifactStore
      # the worker uses, so a bad storage credential fails the deploy instead of
      # a customer build. Reports only error codes and the endpoint's shape.
      # 2026-10-19: runs BEFORE the drain (new image + new .env, nothing stopped yet), so a bad storage credential
      # stops the deploy while the old consumers are still serving instead of after they were replaced.
      - name: Prove artifact storage accepts writes
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps -T worker python - <<'PY'
          import os, sys, uuid
          from urllib.parse import urlsplit
          from omni_prod.storage import S3ArtifactStore

          endpoint = os.environ["OMNI_S3_ENDPOINT"]; bucket = os.environ["OMNI_S3_BUCKET"]
          ak = os.environ["OMNI_S3_ACCESS_KEY"]; sk = os.environ["OMNI_S3_SECRET_KEY"]
          parts = urlsplit(endpoint)
          hexchars = set("0123456789abcdef")
          shape = (f"scheme={parts.scheme} host_suffix={'.'.join((parts.hostname or '').split('.')[-3:])} "
                   f"path={parts.path or '-'!r} bucket_len={len(bucket)} ak_len={len(ak)} sk_len={len(sk)} "
                   f"ak_hex={set(ak) <= hexchars} sk_hex={set(sk) <= hexchars}")

          def attempt(url):
              store = S3ArtifactStore(endpoint=url, bucket=bucket, access_key=ak, secret_key=sk)
              key = f"_deploy-probe/{uuid.uuid4().hex}.txt"
              try:
                  store.put_bytes(key, b"deploy-probe")
                  ok = store.get_bytes(key) == b"deploy-probe"
                  store.client.delete_object(Bucket=bucket, Key=key)
                  return "PASS" if ok else "READBACK_MISMATCH"
              except Exception as exc:
                  code = getattr(exc, "response", {}).get("Error", {}).get("Code") or type(exc).__name__
                  return f"FAIL {code}"

          configured = attempt(endpoint)
          print(f"configured endpoint: {configured}; {shape}")
          if configured == "PASS":
              print(f"::notice title=storage-probe::PASS write, read-back and delete in the artifact bucket ({shape})")
              sys.exit(0)
          host_only = f"{parts.scheme}://{parts.hostname}"
          alt = attempt(host_only) if parts.path not in ("", "/") else "same-as-configured"
          print(f"::error title=storage-probe::configured endpoint {configured}; host-only endpoint {alt}; {shape}")
          sys.exit(1)
          PY

      # Directive 2026-10-09 §18: never replace a worker in the middle of a build
      # or change. `docker stop` sends SIGTERM; an RQ worker then makes a warm
      # shutdown -- it takes no new job and finishes the one it is running. We
      # stop (drain) both workers BEFORE migrations and before any container is
      # replaced (the sandbox runner a build depends on included). New jobs wait
      # in the queue and the new worker takes them. Past the deadline Docker
      # kills the job; that is reported, never hidden.
      # Directive 2026-10-11: never start a drain while a customer job is RUNNING. Waits up to 20 minutes for it to
      # finish (the drain itself would wait up to 25), then FAILS without touching anything. Read-only, no spend.
      - name: Refuse to drain while a build or change is running
        id: idle
        working-directory: infra/worker-host
        # --tolerate-unverified: a DB/Redis outage alone (no running work seen, connection errors only) is a ::warning,
        # not a dead deploy. Running work still refuses (3); a missing table still refuses (2).
        run: docker compose run --rm --no-deps -T worker python -m omni_prod.active_jobs --wait-minutes 20 --tolerate-unverified

      - name: Drain workers (finish running jobs before replacing anything)
        id: drain
        run: bash infra/worker-host/drain.sh

      # A rollback to older code names the newer versions explicitly (workflow_dispatch input); nothing is dropped or
      # hidden and every other migration check stays. A normal push passes nothing and stays strict.
      - name: Apply database migrations
        id: migrate
        working-directory: infra/worker-host
        env:
          ACCEPT_NEWER: ${{ github.event.inputs.accept_newer_migrations }}
        run: |
          set -euo pipefail
          if [ -n "${ACCEPT_NEWER:-}" ]; then
            [[ "$ACCEPT_NEWER" =~ ^[0-9]+(,[0-9]+)*$ ]] || { echo "::error::accept_newer_migrations must be exact versions like 38"; exit 2; }
            docker compose run --rm --no-deps worker python -m omni_prod.migrate --accept-newer "$ACCEPT_NEWER"
          else
            docker compose run --rm --no-deps worker python -m omni_prod.migrate
          fi

      - name: Start
        id: start
        working-directory: infra/worker-host
        run: docker compose up -d --remove-orphans

      - name: Verify maintenance services use 1800-second intervals
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          docker compose ps janitor intake-maintain
          janitor_id=$(docker compose ps -q janitor)
          intake_id=$(docker compose ps -q intake-maintain)
          test -n "$janitor_id" && test -n "$intake_id"
          test "$(docker inspect -f '{{.State.Running}}' "$janitor_id")" = true
          test "$(docker inspect -f '{{.State.Running}}' "$intake_id")" = true
          janitor_interval=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$janitor_id" | sed -n 's/^OMNI_MAINTENANCE_INTERVAL_SECONDS=//p')
          intake_cmd=$(docker inspect -f '{{json .Config.Cmd}}' "$intake_id")
          janitor_cmd=$(docker inspect -f '{{json .Config.Cmd}}' "$janitor_id")
          echo "janitor cmd=$janitor_cmd interval=$janitor_interval"
          echo "intake-maintain cmd=$intake_cmd"
          test "$janitor_interval" = 1800
          case "$intake_cmd" in *'"--loop","1800"'*) ;; *) echo "::error::intake-maintain interval not 1800"; exit 1;; esac
          docker compose logs --no-color --tail 15 janitor intake-maintain | sed -E 's#(postgres(ql)?://)[^[:space:]]+#\\1[REDACTED]#g'
          echo "::notice title=maintenance-intervals::PASS both services running at 1800 seconds"

      - name: Verify worker is consuming the build queue
        id: listen
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if docker compose logs worker 2>&1 | grep -q "Listening on"; then
              docker compose ps
              docker compose logs --tail 20 worker
              exit 0
            fi
            sleep 4
          done
          docker compose ps
          docker compose logs --tail 80 worker
          echo "::error::worker did not start listening on its queue"
          exit 1

      # Directive 2026-10-11: a failed drain, migration, start or queue check must not leave customers without a
      # worker. Restores the PREVIOUS consumers from the recorded images; never touches the database or volumes
      # (migrations are additive, so the old code runs against the newer schema). The run stays red.
      - name: Recover previous workers after a failed drain, migration or start
        if: ${{ failure() && (steps.drain.outcome == 'failure' || steps.migrate.outcome == 'failure' || steps.start.outcome == 'failure' || steps.listen.outcome == 'failure') }}
        run: bash infra/worker-host/recover.sh

      # The sandbox runner reporting healthy did not mean it could run code
      # (its image had no docker client; every build got HTTP 500). This runs
      # a real snippet through the same signed path the worker uses and checks
      # the sandbox has no network.
      - name: Prove the sandbox runs code without network access
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps -T worker python - <<'PY'
          import os, sys
          from omni_prod.remote_sandbox import RemoteSandboxConfig, RemoteSandboxRepositoryExecutor

          probe = (
              "import compileall, socket, sys\n"
              "print('sandbox-ok', sys.version_info[:2])\n"
              "print('compile-ok' if compileall.compile_dir('.', quiet=1) else 'compile-FAILED')\n"
              "try:\n"
              "    socket.create_connection(('1.1.1.1', 53), timeout=3)\n"
              "    print('network-OPEN')\n"
              "except OSError:\n"
              "    print('network-blocked')\n"
          )
          executor = RemoteSandboxRepositoryExecutor(RemoteSandboxConfig(
              os.environ["OMNI_SANDBOX_RUNNER_URL"], os.environ["OMNI_SANDBOX_SHARED_SECRET"], timeout_seconds=120))
          result = executor._run({"probe.py": probe}, ("python", "probe.py"), "deploy-sandbox-probe")
          out = result["stdout"]
          print(f"returncode={result['returncode']} stdout={out.strip()!r} stderr={result['stderr'][-300:]!r}")
          if int(result["returncode"]) != 0 or "sandbox-ok" not in out or "network-blocked" not in out or "compile-ok" not in out:
              err = " ".join(result["stderr"].split())[-300:]
              print(f"::error title=sandbox-probe::returncode={result['returncode']} stdout={out.strip()[:200]!r} stderr={err!r}")
              sys.exit(1)
          print(f"::notice title=sandbox-probe::PASS code ran and compiled in the isolated read-only sandbox ({out.split()[1:3]}), network blocked")
          PY

      # Directive 2026-10-09 §17: the real-browser check runs in its own image
      # with the same isolation. Proven both ways on every deploy: a working
      # fixture product passes, one that hides its message after the first use
      # is caught. A failure here is a warning (builds then record
      # browser_check "unavailable"; never read as passed).
      - name: Prove the browser sandbox clicks through a product
        working-directory: infra/worker-host
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T worker python - <<'PY'
          import os
          from omni_prod.browser_fixtures import fixture_repository
          from omni_prod.browser_probe import BROWSER_PROFILE, PROBE, parse_probe_output
          from omni_prod.remote_sandbox import RemoteSandboxConfig, RemoteSandboxRepositoryExecutor
          from omni_prod.sandbox_script import staged_script   # J2 policy: no newline in argv, so no `python -c PROBE`
          ex = RemoteSandboxRepositoryExecutor(RemoteSandboxConfig(
              os.environ["OMNI_SANDBOX_RUNNER_URL"], os.environ["OMNI_SANDBOX_SHARED_SECRET"], timeout_seconds=200))
          seen = {}
          for name, kw in (("working", {}), ("message-bug", {"feedback_bug": True})):
              try:
                  repo, argv = staged_script(fixture_repository(**kw), "browser_probe", PROBE)
                  r = ex._run(repo, argv, f"deploy-browser-{name}", profile=BROWSER_PROFILE)
                  out = parse_probe_output(r["stdout"])
                  seen[name] = sorted({f["kind"] for f in out["findings"]}) if out else ("no result: " + (r["stdout"] + r["stderr"])[-300:])
              except Exception as exc:
                  seen[name] = f"error: {type(exc).__name__}: {exc}"[:300]
          ok = seen.get("working") == [] and seen.get("message-bug") == ["feedback_disappears"]
          level = "notice" if ok else "warning"
          print(f"::{level} title=browser-probe::{'PASS' if ok else 'NOT WORKING'} working={seen.get('working')} message-bug={seen.get('message-bug')}")
          PY

      - name: Preview edge is up
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            if curl -fsS --max-time 3 http://127.0.0.1:8088/_health >/dev/null; then break; fi; sleep 3
          done
          curl -fsS --max-time 3 http://127.0.0.1:8088/_health >/dev/null || { docker compose logs --tail 40 preview-router; echo "::error title=preview-edge::router not answering"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 -H 'Host: prv-0000000000000000.example' http://127.0.0.1/ || true)
          docker compose ps preview-worker preview-router caddy
          docker compose logs --no-color preview-worker 2>&1 | grep -E "queues:" | tail -1 | sed 's/^[^|]*| //' | while read -r l; do echo "::notice title=preview-worker::$l"; done
          suffix=$(sed -n 's/^OMNI_PREVIEW_HOST_SUFFIX=//p' .env | head -n 1)
          if [ "$code" != "308" ] && [ "$code" != "301" ]; then
            docker compose logs --tail 40 caddy; echo "::error title=preview-edge::caddy on :80 answered $code (expected a redirect to https)"; exit 1
          fi
          echo "::notice title=preview-edge::PASS router healthy, caddy redirects :80 -> https; hostnames *.${suffix}"
          for i in $(seq 1 20); do docker compose logs --no-color janitor 2>&1 | grep -q "maintenance started" && break; sleep 3; done
          line=$(docker compose logs --no-color janitor 2>&1 | grep -E "maintenance started|expired=" | tail -2 | sed 's/^[^|]*| //' | tr '\n' ' ')
          if [ -z "$line" ]; then docker compose logs --tail 30 janitor; echo "::error title=janitor::maintenance loop did not start"; exit 1; fi
          echo "::notice title=janitor::$line"

      # Directive 2026-10-09 §13: the generated product's own data survives a
      # preview restart and a new version, acceptance probes use a scratch copy,
      # and projects never share data. Real containers on this host, $0.
      - name: Prove preview data survives a restart and a new version
        working-directory: infra/worker-host
        run: |
          set -uo pipefail
          docker compose exec -T preview-worker python -m omni_prod.preview_durability 2>&1 | grep -E '^::' || echo "::warning title=preview-data::self-test produced no result"

      # "Listening on" proves the worker started; this proves it consumes the
      # queue. A probe job (stdlib socket.gethostname, no side effects, no
      # build, no model call) is enqueued on omni-builds through the same
      # Redis the web app uses. PASS only if the running worker container on
      # this host executes it: the job returns the hostname of the container
      # that ran it, which must equal the worker container's id.
      - name: Prove the worker executes a job from the build queue
        working-directory: infra/worker-host
        run: |
          set -euo pipefail
          expected=$(docker compose ps -q worker | cut -c1-12)
          if [ -z "$expected" ]; then echo "::error::worker container is not running"; exit 1; fi
          docker compose logs --no-color worker 2>&1 | grep -E "stale consumers absorbed|dequeue wait" | tail -2 \
            | sed 's/^[^|]*| //' | while read -r line; do echo "::notice title=worker-startup::$line"; done
          docker compose run --rm --no-deps -T -e EXPECTED_WORKER_HOST="$expected" worker python - <<'PY'
          import os, socket, sys, time
          from redis import Redis
          from rq import Queue, Worker

          conn = Redis.from_url(os.environ["OMNI_REDIS_URL"])
          queue = Queue("omni-builds", connection=conn)
          workers = Worker.all(queue=queue)
          print(f"workers registered on omni-builds: {len(workers)} ({', '.join(sorted(w.hostname or '?' for w in workers))})")
          job = queue.enqueue("socket.gethostname", job_timeout=60, ttl=120, result_ttl=600, failure_ttl=600,
                              description="deploy probe: worker consumes omni-builds")
          done = {"finished", "failed", "stopped", "canceled"}
          deadline = time.monotonic() + 90

          def current_status():
              value = job.get_status(refresh=True)
              return str(getattr(value, "value", value) or "")

          status = current_status()
          while status not in done and time.monotonic() < deadline:
              time.sleep(2)
              status = current_status()
          job.refresh()
          executed_on = job.return_value(refresh=True) if status == "finished" else None
          expected = os.environ["EXPECTED_WORKER_HOST"]
          print(f"probe job {job.id}: status={status} worker={job.worker_name} executed_on={executed_on} "
                f"expected={expected} enqueued_from={socket.gethostname()}")
          if status != "finished" or executed_on != expected:
              print(f"::error title=worker-queue-probe::job {job.id} status={status} executed_on={executed_on} expected={expected}")
              sys.exit(1)
          print(f"::notice title=worker-queue-probe::PASS job {job.id} enqueued on omni-builds was executed by "
                f"worker {job.worker_name} in container {executed_on} on this host")
          PY

  # ------------------------------------------------------------------------------------------------ recovery drill --
  # 2026-10-27 (Codex + chat): the restore drill on the LIVE worker, not in theory. Works in the DEPLOYED checkout like
  # postdeploy-checks (no actions/checkout: that would delete the deployed .env), never builds, never migrates.
  #   A  a real build (internal QA funding, OMNI_QA_BUILD_MAX_USD=0.50), SIGKILL of the build worker mid-build, restart
  #   B  exactly once, zero duplicates, zero loss, zero double charge -- each a PASS/FAIL ::notice with its numbers
  #   C  recover.sh restores the snapshot images omni-rollback/<svc>:prev; proven running; then roll forward to the
  #      images that were running before the drill, proven running (an always() step rolls forward even on failure)
  drill:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'drill'
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 50
    defaults:
      run:
        working-directory: /home/omni/actions-runner/_work/desktop-tutorial/desktop-tutorial/infra/worker-host
    steps:
      - name: Prepare (deployed revision, image, QA funding)
        run: |
          set -euo pipefail
          test -f .env || { echo "::error title=drill::no deployed .env on this host; deploy first"; exit 1; }
          mkdir -p "$RUNNER_TEMP/pd" "$RUNNER_TEMP/drill-state" && chmod 777 "$RUNNER_TEMP/pd"
          echo "IMG=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q worker)")" >> "$GITHUB_ENV"
          echo "QA_ENV=-e OMNI_ENV=staging -e OMNI_QA_BUILD_MAX_USD=0.50 -e OMNI_QA_BUDGET_TOTAL_USD=10 -e OMNI_QA_BUDGET_SINCE=2026-10-08T17:12:00Z" >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/drill-state/current-images"
          for s in worker intake-worker intake-maintain preview-worker; do
            cid=$(docker compose ps -q "$s" | head -n 1); [ -n "$cid" ] || continue
            echo "$s $(docker inspect -f '{{.Image}}' "$cid")" >> "$RUNNER_TEMP/drill-state/current-images"
          done
          echo "::notice title=drill-start::deployed=$(git -C ../.. rev-parse HEAD) services=$(cut -d' ' -f1 "$RUNNER_TEMP/drill-state/current-images" | tr '\n' ' ')"

      - name: Refuse while customer work is running
        run: docker compose run --rm --no-deps -T worker python -m omni_prod.active_jobs --wait-minutes 20 --tolerate-unverified

      - name: A. Real build, SIGKILL the build worker mid-build, restart
        id: crash
        run: |
          set -uo pipefail
          run() { docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres $QA_ENV \
                    -v "$RUNNER_TEMP/pd:/out" "$IMG" python -m omni_prod.postdeploy_checks "$1" 2>&1 \
                    | grep -E '^(::|POSTDEPLOY|Traceback|[A-Za-z]+Error)' ; }
          rc=0
          run crash-create || rc=1
          # Pre-kill proof that the build is MID-FLIGHT (auditor gap 1): a kill of a worker that never picked the job up
          # interrupts nothing and would let B pass falsely. No proof -> no kill, the step fails.
          docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres -v "$RUNNER_TEMP/pd:/out" "$IMG" \
            python - <<'PY'
          import json, sys
          from omni_prod.postdeploy_checks import sql
          try:
              b = json.load(open('/out/state.json'))['crash_build']
          except Exception as exc:
              print(f'::notice title=drill-A pre-kill::FAIL no build was created ({type(exc).__name__})'); sys.exit(1)
          status = sql('SELECT status FROM build_jobs WHERE id = %s', (b,))[0][0]
          calls = sql("SELECT count(*) FROM task_attempts WHERE build_id = %s AND kind = 'provider_call'", (b,))[0][0]
          ok = str(status).lower() in ('running', 'in_progress', 'started') and calls >= 1
          print(f"::notice title=drill-A pre-kill::{'PASS' if ok else 'FAIL'} build {b} status={status} provider_call_rows={calls} "
                f"(must be running with at least one provider call before the kill)")
          sys.exit(0 if ok else 1)
          PY
          if [ $? -ne 0 ] || [ "$rc" -ne 0 ]; then
            echo "::notice title=drill-A::FAIL the build was not proven mid-flight; NOT killing the worker"; exit 1
          fi
          echo "::notice title=drill-A::SIGKILL the build worker (no drain), build proven mid-flight"
          docker kill "$(docker compose ps -q worker)" >/dev/null
          docker compose start worker
          sleep 170  # the killed worker's registration (ttl 135 s) must expire first
          docker compose run --rm --no-deps -T janitor python -c \
            'import json; from omni_prod.maintenance import recover_now; print("::notice title=drill-A recovery pass::" + json.dumps(recover_now(1)))'
          run crash-verify || rc=1
          exit $rc

      - name: B. Exactly once, zero duplicates, zero loss, zero double charge
        if: always() && steps.crash.outcome != 'skipped'
        run: |
          set -uo pipefail
          docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres -v "$RUNNER_TEMP/pd:/out" "$IMG" \
            python - <<'PY'
          import json, sys
          from decimal import Decimal
          from omni_prod.postdeploy_checks import sql
          try:
              b = json.load(open('/out/state.json'))['crash_build']
          except Exception as exc:
              print(f'::notice title=drill-B::FAIL no crash build recorded ({type(exc).__name__})'); sys.exit(1)
          status, attempts = sql('SELECT status, recovery_attempts FROM build_jobs WHERE id = %s', (b,))[0]
          builds = sql('SELECT count(*) FROM build_jobs WHERE project_id = (SELECT project_id FROM build_jobs WHERE id = %s)', (b,))[0][0]
          calls, traces, metered = sql("SELECT count(*), count(DISTINCT trace_id), COALESCE(sum(metered_cost_usd), 0) "
                                       "FROM task_attempts WHERE build_id = %s AND kind = 'provider_call'", (b,))[0]
          res = sql('SELECT count(*), max(status), max(settled_provider_cost_usd) FROM credit_reservations WHERE build_id = %s', (b,))[0]
          settled = None if res[2] is None else Decimal(str(res[2]))
          checks = {
              'exactly-once': (str(status).lower() == 'ready' and attempts == 1 and builds == 1,
                               f'status={status} recovery_attempts={attempts} builds_in_project={builds}'),
              'zero-duplicates': (builds == 1 and res[0] == 1, f'builds_in_project={builds} reservations={res[0]}'),
              'zero-loss': (str(status).lower() == 'ready' and settled is not None and abs(settled - Decimal(str(metered))) < Decimal('0.000001'),
                            f'status={status} ledger_calls={calls} workers={traces} metered={metered} settled={settled}'),
              'zero-double-charge': (res[0] == 1 and (settled is None or settled <= Decimal(str(metered)) + Decimal('0.000001')),
                                     f'reservations={res[0]} reservation_status={res[1]} settled={settled} metered={metered} '
                                     f'SCOPE internal ledger vs reservation only - no provider-side billing reconciliation'),
          }
          for name, (ok, detail) in checks.items():
              print(f"::notice title=drill-B {name}::{'PASS' if ok else 'FAIL'} build {b} {detail}")
          sys.exit(0 if all(ok for ok, _ in checks.values()) else 1)
          PY

      - name: C1. recover.sh restores the snapshot images (omni-rollback/<svc>:prev)
        id: rollback
        if: always()
        env:
          DEPLOY_STATE_DIR: ${{ runner.temp }}/drill-state
        # recover.sh exits 0 also when it restores NOTHING (no list, or not-stopped). Its exit code is therefore never
        # the verdict: this step writes its OWN rollback list in its own state dir, proves every snapshot image exists,
        # and passes only when every pre-drill service is verified running on exactly its snapshot image.
        run: |
          set -uo pipefail
          ok=1; list="$DEPLOY_STATE_DIR/prev-images"
          rm -f "$DEPLOY_STATE_DIR/not-stopped" "$DEPLOY_STATE_DIR/rollback.yml"; : > "$list"
          [ -s "$DEPLOY_STATE_DIR/current-images" ] || { echo "::notice title=drill-C rollback::FAIL no pre-drill service list"; exit 1; }
          while read -r s img; do
            snap=$(docker image inspect -f '{{.Id}}' "omni-rollback/$s:prev" 2>/dev/null)
            if [ -z "$snap" ]; then
              echo "::notice title=drill-C snapshot::FAIL $s has no omni-rollback/$s:prev image"; ok=0; continue
            fi
            rev=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "omni-rollback/$s:prev")
            if [ "$snap" = "$img" ]; then   # restoring the image that is already running would prove nothing
              echo "::notice title=drill-C snapshot::FAIL $s omni-rollback/$s:prev is the image already running (id=${snap:7:12}); a rollback to it proves nothing"; ok=0
            else
              echo "::notice title=drill-C snapshot::PASS $s omni-rollback/$s:prev exists id=${snap:7:12} revision=${rev:-unlabelled}, differs from the running image"
            fi
            echo "$s $(docker compose ps -q "$s" | head -n 1) omni-rollback/$s:prev" >> "$list"
          done < "$DEPLOY_STATE_DIR/current-images"
          echo "::notice title=drill-C list::$(wc -l < "$list") services written to $list (own list, this run's state dir)"
          bash recover.sh; echo "::notice title=drill-C recover.sh::exit $? (informational only, never the verdict)"
          [ -s "$DEPLOY_STATE_DIR/rollback.yml" ] || { echo "::notice title=drill-C rollback::FAIL recover.sh wrote no rollback compose file: nothing was restored"; ok=0; }
          while read -r s _ ref; do
            cid=$(docker compose -f docker-compose.yml -f "$DEPLOY_STATE_DIR/rollback.yml" ps -q "$s" 2>/dev/null | head -n 1)
            run=$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null)
            want=$(docker image inspect -f '{{.Id}}' "$ref" 2>/dev/null); got=$(docker inspect -f '{{.Image}}' "$cid" 2>/dev/null)
            if [ "$run" = true ] && [ -n "$want" ] && [ "$want" = "$got" ]; then echo "::notice title=drill-C rollback::PASS $s running on $ref"
            else echo "::notice title=drill-C rollback::FAIL $s running=${run:-no} image_matches_snapshot=$([ -n "$want" ] && [ "$want" = "$got" ] && echo yes || echo no)"; ok=0; fi
          done < "$list"
          [ "$(wc -l < "$list")" -eq "$(wc -l < "$DEPLOY_STATE_DIR/current-images")" ] || ok=0
          [ "$ok" -eq 1 ]

      - name: C2. Roll forward to the images that were running before the drill (always)
        if: always()
        env:
          DEPLOY_STATE_DIR: ${{ runner.temp }}/drill-state
        run: |
          set -uo pipefail
          docker compose up -d --no-build --remove-orphans
          ok=1
          while read -r s img; do
            got=""; for i in $(seq 1 15); do
              cid=$(docker compose ps -q "$s" | head -n 1)
              [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null)" = true ] && got=$(docker inspect -f '{{.Image}}' "$cid") && break
              sleep 2
            done
            if [ "$got" = "$img" ]; then echo "::notice title=drill-C roll-forward::PASS $s back on the pre-drill image"
            else echo "::notice title=drill-C roll-forward::FAIL $s running_image_matches_pre_drill=no"; ok=0; fi
          done < "$DEPLOY_STATE_DIR/current-images"
          for i in $(seq 1 15); do docker compose logs worker 2>&1 | tail -50 | grep -q "Listening on" && break; sleep 2; done
          docker compose logs worker 2>&1 | tail -50 | grep -q "Listening on" \
            && echo "::notice title=drill-C roll-forward::PASS worker listening on its queue" \
            || { echo "::notice title=drill-C roll-forward::FAIL worker not listening"; ok=0; }
          [ "$ok" -eq 1 ]
