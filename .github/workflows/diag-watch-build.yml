name: diag watch build (read-only, branch only)

# Founder 2026-11-01 22:28: the founder starts ONE real build from the site; this only WATCHES (read-only SELECTs).
#  - the first build_jobs row created after this job starts: its build_id, at once
#  - 60 s after creation not RUNNING (or no row at all after 20 min) -> ::error, stop watching, no interpretation
#  - spend above 0.50 -> ::error (the build's own budget stops it; nothing here stops anything)
#  - at the end: status, error_code, repair_rounds, provider spend, the failure messages, round snapshots
# Each step prints at most 10 annotations. No checkout, nothing written, nothing started or stopped.
on:
  push:
    branches: [diag/watch-build-20261101]

permissions:
  contents: read

concurrency:
  group: diag-watch-build
  cancel-in-progress: false

jobs:
  watch:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 75
    steps:
      - name: Watch for the build (read-only)
        id: watch
        shell: bash
        run: |
          set +e
          set -uo pipefail
          wd=$(docker inspect omni-worker-worker-1 --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')
          out=$(mktemp -d); chmod 777 "$out"   # the container user may not be the runner user; echo "out=$out" >> "$GITHUB_OUTPUT"
          cd "$wd"
          docker compose run --rm --no-deps -T -v "$out:/out" worker python - <<'PY'
          import datetime as dt, json, os, time, psycopg
          def note(t, b, lvl='notice'):
              print(f'::{lvl} title={t}::' + str(b).replace('%', '%25').replace('\n', '%0A')[:3400], flush=True)
          conn = psycopg.connect(os.environ['OMNI_DATABASE_URL'], connect_timeout=10, autocommit=True)
          conn.read_only = True
          t0 = conn.execute('SELECT now()').fetchone()[0]
          note('watch started', f'watching build_jobs created after {t0:%Y-%m-%d %H:%M:%S}Z (up to 20 min for the build to appear)')
          row, deadline = None, time.time() + 20 * 60
          while time.time() < deadline:
              row = conn.execute("SELECT id, created_at FROM build_jobs WHERE created_at > %s ORDER BY created_at LIMIT 1", (t0,)).fetchone()
              if row: break
              time.sleep(3)
          if not row:
              note('NO BUILD', 'no build_jobs row was created within 20 minutes of the watch starting', 'error'); raise SystemExit(3)
          bid, created = row
          note('1. build_id', f'{bid} created {created:%H:%M:%S}Z')
          timeline, last, spend_alarm = [], None, False
          end = time.time() + 55 * 60
          while time.time() < end:
              r = conn.execute("SELECT status, phase, started_at, finished_at, error_code, repair_rounds, evidence_json->>'provider_spend_usd' "
                               "FROM build_jobs WHERE id = %s", (bid,)).fetchone()
              status, phase = r[0], r[1]
              if (status, phase) != last:
                  now = conn.execute('SELECT now()').fetchone()[0]
                  timeline.append(f'{now:%H:%M:%S} {status}/{phase}'); last = (status, phase)
              age = (conn.execute('SELECT now()').fetchone()[0] - created).total_seconds()
              if status == 'queued' and age > 60 and not any('running' in x for x in timeline):
                  note('2. NOT RUNNING after 60 s', f'{bid} still {status}/{phase} {int(age)} s after creation; timeline: {" -> ".join(timeline)}', 'error')
                  json.dump({'build_id': bid, 'timeline': timeline, 'stopped': 'not running after 60 s'}, open('/out/watch.json', 'w')); raise SystemExit(4)
              try:
                  if r[6] is not None and float(r[6]) > 0.50 and not spend_alarm:
                      note('5. SPEND ABOVE 0.50', f'{bid} provider_spend_usd={r[6]}', 'error'); spend_alarm = True
              except ValueError:
                  pass
              if status in ('ready', 'failed', 'cancelled'):
                  break
              time.sleep(5)
          full = conn.execute("SELECT status, phase, error_code, error_message, repair_rounds, evidence_json, created_at, started_at, finished_at "
                              "FROM build_jobs WHERE id = %s", (bid,)).fetchone()
          json.dump({'build_id': bid, 'timeline': timeline, 'status': full[0], 'phase': full[1], 'error_code': full[2],
                     'error_message': full[3], 'repair_rounds': full[4], 'evidence': full[5],
                     'times': [str(x) for x in full[6:9]]}, open('/out/watch.json', 'w'), default=str)
          note('timeline', ' -> '.join(timeline))
          PY
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: 3. the result row (status, error, repair_rounds, spend)
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.watch.outputs.out }}
        run: |
          set +e
          python3 - "$OUT/watch.json" <<'PY'
          import json, re, sys
          def note(t, b, lvl='notice'):
              b = re.sub(r'(AIza|sk-ant-|sk-)[0-9A-Za-z_-]{8,}', r'\1<redacted>', str(b))
              print(f'::{lvl} title={t}::' + b.replace('%', '%25').replace('\n', '%0A')[:3400], flush=True)
          try:
              w = json.load(open(sys.argv[1]))
          except Exception as exc:
              note('3. no result file', f'{type(exc).__name__}', 'error'); raise SystemExit(0)
          ev = w.get('evidence') or {}
          if isinstance(ev, str):
              ev = json.loads(ev)
          note('3. status', f"{w['build_id']} status={w.get('status')} phase={w.get('phase')} error_code={w.get('error_code')} | timeline: {' -> '.join(w.get('timeline') or [])}")
          note('3. error_message', w.get('error_message') or '(none)')
          note('3. repair_rounds / spend', f"repair_rounds={w.get('repair_rounds')} evidence.repair_rounds={ev.get('repair_rounds')} "
               f"provider_spend_usd={ev.get('provider_spend_usd')} external_model_calls={ev.get('external_model_calls')} "
               f"stop_reason={ev.get('repair_stop_reason')} first_pass={ev.get('first_pass')}")
          note('3. evidence keys', ', '.join(sorted(ev)))
          snaps = ev.get('round_snapshots') or []
          note('4. round snapshots', json.dumps(snaps)[:3000] if snaps else '(none recorded)')
          PY

      - name: 3. the failure messages and evidence (each its own annotation)
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.watch.outputs.out }}
        run: |
          set +e
          python3 - "$OUT/watch.json" <<'PY'
          import json, re, sys
          def note(t, b):
              b = re.sub(r'(AIza|sk-ant-|sk-)[0-9A-Za-z_-]{8,}', r'\1<redacted>', str(b))
              print(f'::notice title={t}::' + b.replace('%', '%25').replace('\n', '%0A')[:3400], flush=True)
          try:
              w = json.load(open(sys.argv[1]))
          except Exception:
              raise SystemExit(0)
          ev = w.get('evidence') or {}
          if isinstance(ev, str):
              ev = json.loads(ev)
          fails = ev.get('failures') or []
          if not fails:
              note('3. failures', '(no failures list in evidence)')
          for i, f in enumerate(fails[:9]):
              note(f"3. failure {i + 1} {f.get('acceptance_id')}", f"{f.get('message')}\n--- evidence (head 1200) ---\n{str(f.get('evidence') or '')[:1200]}")
          PY

      - name: Remove the result file
        if: always()
        shell: bash
        env:
          OUT: ${{ steps.watch.outputs.out }}
        run: '[ -n "$OUT" ] && rm -rf "$OUT" || true'
