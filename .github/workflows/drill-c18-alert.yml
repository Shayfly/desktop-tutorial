name: Drill C18 (the alert fires)

# Monthly drill C18 (CONTROLS.json: "tested: the alert arrives, not that the system recovers"). DECISIONS question 8,
# option (a), the owner's approval of 2026-11-21: C18 is drilled in two halves. This file is the ALERT half, which now
# runs on main by itself on the 1st and the 16th (twice a month, so one failed run never lets the monthly record lapse;
# registry_lint R3 reads these runs from GitHub, drill_workflow). The RECOVERY half -- killing the live worker under
# the owner's conditions (a build_requests query, the recovery command written first, a 30-second ceiling, a manual
# restore at 2 minutes) -- stays a manual drill: nothing here touches the worker.
#
# The whole real alert path, on a queue nobody consumes: tools/worker_alert.py reads the RQ registry from the
# production Redis, decides, opens an issue under the drill label (a notification to the owner) and closes it.
# Expected, stated before every run: verdict dead (exit 1, never 2 = unverified), "opened and closed drill issue #N".
# Then this run is green. Anything else = FAIL, and an issue says so. Production's own queue is not read or touched;
# the real alert keeps running every 5 minutes in worker-alert.yml.
on:
  schedule:
    - cron: '47 3 1,16 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drill-c18-alert
  cancel-in-progress: false

jobs:
  c18-alert-half:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the worker's own Redis client and rq
        run: python -m pip install -q "redis==8.1.0" "rq==2.12.0"
      - name: C18 alert half -- a queue with no consumer must raise the alert
        env:
          OMNI_REDIS_URL: ${{ secrets.OMNI_REDIS_URL }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          python tools/worker_alert.py --repo "$GITHUB_REPOSITORY" --queue omni-drill-no-consumer --drill \
            > "$RUNNER_TEMP/alert.out" 2>&1
          rc=$?
          cat "$RUNNER_TEMP/alert.out"
          if [ "$rc" -eq 1 ] && grep -q '^::notice title=worker alert dead::omni-drill-no-consumer' "$RUNNER_TEMP/alert.out" \
             && grep -q 'opened and closed drill issue #' "$RUNNER_TEMP/alert.out"; then
            echo "::notice title=C18 alert half PASS::the alert read the registry, found no live worker on omni-drill-no-consumer, and raised and closed its drill issue"
          else
            echo "::error title=C18 alert half FAIL::expected exit 1 (dead) and an opened-and-closed drill issue; got exit $rc"
            exit 1
          fi
      - name: A failed drill opens an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="DRILL FAILED: C18 the alert fires ($(date -u +%F))" \
            -f "labels[]=drill-failed" \
            -f body="The scheduled drill C18 (alert half) failed or could not run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Exit 2 means the registry could not be read (OMNI_REDIS_URL, Redis) -- the real alert cannot see a dead worker either."
