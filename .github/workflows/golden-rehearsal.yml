name: Golden build rehearsal

# Runs the real build pipeline (model routes, isolated sandbox, preview start
# check, quality gate) on one prompt on the worker host, with no database
# writes, no project and no credit reservation. The model gateway budget
# (OMNI_EXTERNAL_BUDGET_USD, default 0.50 here) bounds spend. Publishes the
# outcome as annotations. Push trigger: registers the workflow once.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Product request
        required: true
        default: "אתר בעברית לניהול טבלת ליגת כדורגל: טבלה עם נקודות והפרש שערים, טופס להוספת קבוצה, טופס להזנת תוצאה בין שתי קבוצות, וכפתור מחיקה ליד כל קבוצה. ניצחון 3 נקודות, תיקו 1, הפסד 0. בלי התחברות משתמשים."
      answers:
        description: 'Optional JSON: the customer''s own answers, e.g. {"content_only":"yes","personal_data":"no","login":"none"}. With it the build gets the approved brief a customer''s build gets; empty = the raw request.'
        required: false
        default: ""
      models:
        description: "Optional: only these catalog names, comma separated (cost comparison per provider)"
        required: false
        default: ""
      site_library:
        description: "The content route for this rehearsal: empty = as the worker is deployed (a rehearsal has no account, so 'accounts' means the existing path); on = through the new engine; off = the existing path"
        required: false
        default: ""
      image:
        description: "Optional (warehouse 117/118): a committed fixture photo goes through a customer's path as the hero. Empty = text only; customer_photo = tests/fixtures/rehearsal/customer_photo.jpg. Needs the brief: empty answers become '{}'. The report says whether the photo reached the page as a file (not base64) and whether the hero was kept; either one no is a red run."
        required: false
        default: ""
      account:
        description: "Optional (warehouse 71): empty = no account, as before; non_founder = the worker's founder-only features (agentic repair, design critic, image match) decide for a non-founder account, and the report says what each decided"
        required: false
        default: ""
      time_budget:
        description: "Optional (warehouse 115): empty = the worker's own build time budget (repair stops at 780 s, the build stops itself at 1020 s). 'repair,stop' in seconds, e.g. 120,600, only SHORTENS it, so a short run reaches the self-stop; the report names how the build ended"
        required: false
        default: ""
  push:
    branches: [milestone/pre-staging-2026-10-05]
    paths: [.github/workflows/golden-rehearsal.yml]

concurrency:
  group: golden-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 30
    steps:
      - name: Rehearse one build
        timeout-minutes: 25                 # the job keeps 5 minutes for the artifact; a hung build never holds the runner
        working-directory: /home/omni/actions-runner/_work/desktop-tutorial/desktop-tutorial/infra/worker-host
        env:
          PROMPT: ${{ inputs.prompt }}
          ANSWERS: ${{ inputs.answers }}
          MODELS: ${{ inputs.models }}
          SITE_LIBRARY: ${{ inputs.site_library }}
          IMAGE: ${{ inputs.image }}
          ACCOUNT: ${{ inputs.account }}
          TIME_BUDGET: ${{ inputs.time_budget }}
        run: |
          # GitHub runs this with `bash -e`: a failed rehearsal (exit 1) must not stop the step before its output and
          # taxonomy are written (run 39309736314 lost both). Errors are handled explicitly; the exit code is kept.
          set +e
          set -uo pipefail
          # 2026-11-21: the route of this rehearsal is said, never guessed. An unknown value stops here (no silent default).
          route_env=()
          case "${SITE_LIBRARY:-}" in
            "") echo "::notice title=rehearsal route::as deployed" ;;
            on|off) route_env=(-e "OMNI_SITE_LIBRARY=$SITE_LIBRARY"); echo "::notice title=rehearsal route::OMNI_SITE_LIBRARY=$SITE_LIBRARY" ;;
            *) echo "::error title=rehearsal route::site_library must be empty, on or off, not '$SITE_LIBRARY'"; exit 1 ;;
          esac
          # 2026-11-27 (warehouse 117/71/115/118): the optional photo, account and time budget reach omni_prod.rehearsal as
          # REHEARSAL_* variables; main() reads them and raises on any value it does not know. An image goes through the
          # customer's path, which starts from the approved brief: with no answers the brief is empty ('{}'), never the
          # raw request (main() refuses an image without it).
          route_env+=(-e "REHEARSAL_IMAGE=${IMAGE:-}" -e "REHEARSAL_ACCOUNT=${ACCOUNT:-}" -e "REHEARSAL_TIME_BUDGET=${TIME_BUDGET:-}")
          if [ -n "${IMAGE:-}" ] && [ -z "${ANSWERS:-}" ]; then ANSWERS="{}"; fi
          echo "::notice title=rehearsal options::image=${IMAGE:-none} account=${ACCOUNT:-none} time_budget=${TIME_BUDGET:-worker default}"
          docker compose run --rm --no-deps -T "${route_env[@]}" -e OMNI_EXTERNAL_BUDGET_USD=0.50 -e OMNI_EXTERNAL_CALLS_PER_BUILD=40 -e OMNI_MODEL_ONLY="$MODELS" -e PROMPT="$PROMPT" -e ANSWERS="$ANSWERS" worker \
            python -c 'import os, sys; from omni_prod.rehearsal import main; sys.exit(main([os.environ["PROMPT"], os.environ.get("ANSWERS", "")]))' 2>&1 \
            | sed -E 's/(AIza|sk-ant-|sk-)[0-9A-Za-z_-]{16,}/[redacted]/g' > "$RUNNER_TEMP/rehearsal.out"
          rc=${PIPESTATUS[0]}                # the REHEARSAL's exit code (docker compose run), never the sed or a later command
          readonly rc
          echo "rehearsal exit code: $rc"
          grep -E '^(::notice|::error|Traceback|  File|[A-Za-z]+Error)' "$RUNNER_TEMP/rehearsal.out" | tail -40
          # 2026-10-19: failure taxonomy + one build record for first_pass_yield (no product content, no secrets)
          mkdir -p "$RUNNER_TEMP/taxonomy"
          export RUN_ID="${{ github.run_id }}" COMMIT="${{ github.sha }}"
          if command -v python3 >/dev/null; then PYRUN=(python3); else      # host without python: the pinned slim image
            PYRUN=(docker run --rm -i -e RUN_ID -e COMMIT -v "$RUNNER_TEMP:$RUNNER_TEMP" python:3.11-slim python3); fi
          "${PYRUN[@]}" - "$RUNNER_TEMP/rehearsal.out" "$RUNNER_TEMP/taxonomy" <<'PY'
          import json, os, sys, datetime
          rep = None
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              if line.startswith('REHEARSAL '):
                  rep = json.loads(line[len('REHEARSAL '):])
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          base = {'run_id': os.environ['RUN_ID'], 'commit': os.environ['COMMIT'][:12], 'at': now}
          if rep is None:
              build = {**base, 'outcome': 'no_report', 'first_pass': False, 'repair_rounds': None}
              failures = []
          else:
              build = {**base, 'outcome': rep.get('outcome'), 'first_pass': bool(rep.get('first_pass')),
                       'repair_rounds': rep.get('repair_rounds'), 'spend_usd': rep.get('authorized_spend_usd'),
                       'seconds': rep.get('seconds')}
              failures = [{**base, **f} for f in rep.get('failure_taxonomy') or []]
          with open(os.path.join(sys.argv[2], 'builds.jsonl'), 'w') as fh:
              fh.write(json.dumps(build) + '\n')
          with open(os.path.join(sys.argv[2], 'failures.jsonl'), 'w') as fh:
              fh.writelines(json.dumps(f) + '\n' for f in failures)
          import collections
          dist = collections.Counter((f['layer'], f['failure_type']) for f in failures)
          rounds = collections.defaultdict(list)
          for f in failures:
              rounds[f['round_index']].append(f"{f['layer']}/{f['failure_type']}{'' if f['was_repaired'] else ' (not repaired)'}")
          summary = (f"outcome={build['outcome']} first_pass={build['first_pass']} repair_rounds={build['repair_rounds']} "
                     f"spend_usd={build.get('spend_usd')} seconds={build.get('seconds')} failures={len(failures)} | "
                     + '; '.join(f"{l}/{t}={n}" for (l, t), n in sorted(dist.items())) + ' | by round: '
                     + '; '.join(f"r{k}: {', '.join(v)}" for k, v in sorted(rounds.items())))
          print('TAXONOMY-SUMMARY ' + summary)                                   # stdout: in the job log either way
          for f in failures:
              print('TAXONOMY ' + json.dumps(f))
          print('::warning title=taxonomy summary::' + summary.replace('%', '%25')[:3000])
          PY
          exit $rc

      # 2026-11-27 (run 46005664127): the workflow printed `image=customer_photo`, the build ended READY and no `customer
      # photo` line ever appeared, because the worker image was built before the option existed (the last [release]
      # deploy) and its rehearsal ignored REHEARSAL_IMAGE without a word. A requested option now has to be PROVEN
      # applied by the report the container printed (`options_applied`); a report that does not say so is a red run.
      - name: Prove the requested options were applied
        if: always()
        env:
          IMAGE: ${{ inputs.image }}
          ACCOUNT: ${{ inputs.account }}
          TIME_BUDGET: ${{ inputs.time_budget }}
        run: |
          set -uo pipefail
          if command -v python3 >/dev/null; then PYRUN=(python3); else
            PYRUN=(docker run --rm -i -e IMAGE -e ACCOUNT -e TIME_BUDGET -e RUNNER_TEMP -v "$RUNNER_TEMP:$RUNNER_TEMP" python:3.11-slim python3); fi
          "${PYRUN[@]}" - "$RUNNER_TEMP/rehearsal.out" <<'PY'
          import json, os, sys
          image, account, budget = (os.environ.get(k, '').strip() for k in ('IMAGE', 'ACCOUNT', 'TIME_BUDGET'))
          if not (image or account or budget):
              print('::notice title=rehearsal options::none requested, nothing to prove')
              sys.exit(0)
          rep = None
          try:
              for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
                  if line.startswith('REHEARSAL '):
                      rep = json.loads(line[len('REHEARSAL '):])
          except OSError as exc:
              print(f'::error title=rehearsal options::the rehearsal output cannot be read: {exc}')
              sys.exit(1)
          asked = f'image={image or "-"} account={account or "-"} time_budget={budget or "-"}'
          if rep is None:
              print(f'::error title=rehearsal options::requested {asked} but the container printed no REHEARSAL report')
              sys.exit(1)
          applied = rep.get('options_applied')
          if applied is None:
              print(f'::error title=rehearsal options::requested {asked} but the report has no options_applied: the worker image '
                    'runs a rehearsal that does not know these options (it was built before the commit of this workflow; '
                    'deploy it with a [release] commit) and ignored them')
              sys.exit(1)
          bad = []
          if image and applied.get('image') != image:
              bad.append(f'image {image!r} (applied {applied.get("image")!r})')
          if account and applied.get('account') != account:
              bad.append(f'account {account!r} (applied {applied.get("account")!r})')
          if budget and ','.join(str(x) for x in applied.get('time_budget') or []) != ','.join(x.strip() for x in budget.split(',')):
              bad.append(f'time_budget {budget!r} (applied {applied.get("time_budget")!r})')
          if bad:
              print('::error title=rehearsal options::not applied: ' + '; '.join(bad))
              sys.exit(1)
          if image:
              photo = rep.get('photo')
              if not isinstance(photo, dict):
                  print(f'::error title=customer photo::requested image={image} but the report has no photo section')
                  sys.exit(1)
              kind = 'notice' if photo.get('ok') else 'error'
              print(f"::{kind} title=customer photo::photo_as_file={photo.get('as_file')} hero_kept={photo.get('hero_kept')} "
                    f"inline_data_uri_in={photo.get('inline_data_uri_in')}")
              if not photo.get('ok'):
                  sys.exit(1)
          if account and not isinstance(rep.get('account'), dict):
              print('::error title=account::requested a non-founder account but the report has no account section')
              sys.exit(1)
          if budget and not isinstance(rep.get('time_budget'), dict):
              print('::error title=time budget::requested a time budget but the report has no time_budget section')
              sys.exit(1)
          print(f'::notice title=rehearsal options::applied {asked}')
          PY

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rehearsal-taxonomy
          path: ${{ runner.temp }}/taxonomy
          if-no-files-found: warn
          retention-days: 30

  # Reports this rehearsal's failure taxonomy and first-pass result in the run summary and as the artifact
  # rehearsal-taxonomy-report. Until 2026-11-21 this job appended to smoke/*.jsonl and pushed straight to main; main's
  # protection (C16, live since 2026-10-20) rejects every direct push, so every rehearsal since then ended red here
  # (critical-path freshness counted the path BROKEN although the rehearsal step passed) and smoke/rehearsal-builds.jsonl
  # still holds one build, of 2026-10-19. Nothing is pushed now; the job only reads.
  publish-taxonomy:
    needs: rehearsal
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v7
        continue-on-error: true            # a missing artifact is evidence too: the build is recorded as no_artifact
        with:
          name: rehearsal-taxonomy
          path: taxonomy
      - name: Report this rehearsal (run summary and artifact)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          mkdir -p smoke taxonomy
          if [ ! -s taxonomy/builds.jsonl ]; then
            printf '{"run_id": "%s", "commit": "%s", "outcome": "no_artifact", "first_pass": false, "repair_rounds": null}\n' \
              "${{ github.run_id }}" "$(echo '${{ github.sha }}' | cut -c1-12)" > taxonomy/builds.jsonl
            : > taxonomy/failures.jsonl
            echo "::warning title=publish-taxonomy::no taxonomy artifact from the rehearsal job; recorded as no_artifact"
          fi
          python3 - <<'PY'
          import json, collections, os
          builds = [json.loads(l) for l in open('taxonomy/builds.jsonl') if l.strip()]
          fails = [json.loads(l) for l in open('taxonomy/failures.jsonl') if l.strip()]
          last = builds[-1]
          by_layer = collections.Counter(f['layer'] for f in fails if f['run_id'] == last['run_id'])
          dist = collections.Counter((f['layer'], f['failure_type']) for f in fails if f['run_id'] == last['run_id'])
          print('TAXONOMY-DISTRIBUTION ' + json.dumps({f'{l}/{t}': n for (l, t), n in sorted(dist.items())}))
          line = (f"this run: outcome={last.get('outcome')} first_pass={last.get('first_pass')} "
                  f"repair_rounds={last.get('repair_rounds')} failures_by_layer={dict(by_layer)}")
          print(f"::notice title=rehearsal result::{line}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f"## Rehearsal {os.environ['GITHUB_RUN_ID']}\n\n- {line}\n- taxonomy: "
                        + json.dumps({f'{l}/{t}': n for (l, t), n in sorted(dist.items())}) + "\n")
          PY
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: rehearsal-taxonomy-report
          path: taxonomy/
          retention-days: 90
