name: Golden build rehearsal

# Runs the real build pipeline (model routes, isolated sandbox, preview start
# check, quality gate) on one prompt on the worker host, with no database
# writes, no project and no credit reservation. The model gateway budget
# (OMNI_EXTERNAL_BUDGET_USD, default 0.50 here) bounds spend. Publishes the
# outcome as annotations. Push trigger: registers the workflow once.
on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Product request
        required: true
        default: "אתר בעברית לניהול טבלת ליגת כדורגל: טבלה עם נקודות והפרש שערים, טופס להוספת קבוצה, טופס להזנת תוצאה בין שתי קבוצות, וכפתור מחיקה ליד כל קבוצה. ניצחון 3 נקודות, תיקו 1, הפסד 0. בלי התחברות משתמשים."
      models:
        description: "Optional: only these catalog names, comma separated (cost comparison per provider)"
        required: false
        default: ""
  push:
    branches: [milestone/pre-staging-2026-10-05]
    paths: [.github/workflows/golden-rehearsal.yml]

concurrency:
  group: golden-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 30
    steps:
      - name: Rehearse one build
        working-directory: /home/omni/actions-runner/_work/desktop-tutorial/desktop-tutorial/infra/worker-host
        env:
          PROMPT: ${{ inputs.prompt }}
          MODELS: ${{ inputs.models }}
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T -e OMNI_EXTERNAL_BUDGET_USD=0.50 -e OMNI_EXTERNAL_CALLS_PER_BUILD=40 -e OMNI_MODEL_ONLY="$MODELS" -e PROMPT="$PROMPT" worker \
            python -c 'import os, sys; from omni_prod.rehearsal import main; sys.exit(main([os.environ["PROMPT"]]))' 2>&1 \
            | sed -E 's/(AIza|sk-ant-|sk-)[0-9A-Za-z_-]{16,}/[redacted]/g' > "$RUNNER_TEMP/rehearsal.out"
          rc=${PIPESTATUS[0]}
          grep -E '^(::notice|::error|Traceback|  File|[A-Za-z]+Error)' "$RUNNER_TEMP/rehearsal.out" | tail -40
          # 2026-10-19: failure taxonomy + one build record for first_pass_yield (no product content, no secrets)
          mkdir -p "$RUNNER_TEMP/taxonomy"
          RUN_ID="${{ github.run_id }}" COMMIT="${{ github.sha }}" python3 - "$RUNNER_TEMP/rehearsal.out" "$RUNNER_TEMP/taxonomy" <<'PY'
          import json, os, sys, datetime
          rep = None
          for line in open(sys.argv[1], encoding='utf-8', errors='replace'):
              if line.startswith('REHEARSAL '):
                  rep = json.loads(line[len('REHEARSAL '):])
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          base = {'run_id': os.environ['RUN_ID'], 'commit': os.environ['COMMIT'][:12], 'at': now}
          if rep is None:
              build = {**base, 'outcome': 'no_report', 'first_pass': False, 'repair_rounds': None}
              failures = []
          else:
              build = {**base, 'outcome': rep.get('outcome'), 'first_pass': bool(rep.get('first_pass')),
                       'repair_rounds': rep.get('repair_rounds'), 'spend_usd': rep.get('authorized_spend_usd'),
                       'seconds': rep.get('seconds')}
              failures = [{**base, **f} for f in rep.get('failure_taxonomy') or []]
          with open(os.path.join(sys.argv[2], 'builds.jsonl'), 'w') as fh:
              fh.write(json.dumps(build) + '\n')
          with open(os.path.join(sys.argv[2], 'failures.jsonl'), 'w') as fh:
              fh.writelines(json.dumps(f) + '\n' for f in failures)
          PY
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rehearsal-taxonomy
          path: ${{ runner.temp }}/taxonomy
          if-no-files-found: warn
          retention-days: 30

  # Appends this rehearsal to smoke/failure-taxonomy.jsonl (one line per failure) and smoke/rehearsal-builds.jsonl
  # (one line per build) on main and reports first_pass_yield = first-pass builds / builds. [skip ci] commit.
  publish-taxonomy:
    needs: rehearsal
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: rehearsal-taxonomy
          path: taxonomy
      - name: Append and report first_pass_yield
        run: |
          set -euo pipefail
          mkdir -p smoke
          cat taxonomy/failures.jsonl >> smoke/failure-taxonomy.jsonl
          cat taxonomy/builds.jsonl >> smoke/rehearsal-builds.jsonl
          python3 - <<'PY'
          import json, collections
          builds = [json.loads(l) for l in open('smoke/rehearsal-builds.jsonl') if l.strip()]
          fails = [json.loads(l) for l in open('smoke/failure-taxonomy.jsonl') if l.strip()]
          fp = sum(1 for b in builds if b.get('first_pass'))
          last = builds[-1]
          by_layer = collections.Counter(f['layer'] for f in fails if f['run_id'] == last['run_id'])
          print(f"::notice title=first_pass_yield::{fp}/{len(builds)} = {fp / len(builds):.0%} over all recorded rehearsals; "
                f"this run: outcome={last.get('outcome')} first_pass={last.get('first_pass')} "
                f"repair_rounds={last.get('repair_rounds')} failures_by_layer={dict(by_layer)}")
          PY
          git config user.name smoke-bot && git config user.email smoke-bot@148ai.dev
          git add smoke/failure-taxonomy.jsonl smoke/rehearsal-builds.jsonl
          git commit -q -m "chore: rehearsal taxonomy ${{ github.run_id }} [skip ci]"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep 5; done
          echo "::error title=publish-taxonomy::could not push the taxonomy to main"; exit 1
