name: Good builds on the new engine

# The owner, 2026-11-22 (DECISIONS.md): the old site path is deleted after three good builds on the new engine, in three
# different domains. Conditions 1-3 are counted from the database (tools/good_builds.py, a READ ONLY transaction);
# condition 4 is the owner's word, read from the DECISIONS.md lines he writes. Nothing is committed and no PR is
# opened: the numbers go to the run summary and an artifact. Red only when the database cannot be read.
on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: good-builds
  cancel-in-progress: false

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the database client the platform runs
        run: python -m pip install -q "psycopg[binary]==3.3.6"
      - name: Count good builds (read-only)
        env:
          OMNI_DATABASE_URL: ${{ secrets.OMNI_DATABASE_URL }}
        run: python tools/good_builds.py --since 2026-11-22 --out good-builds.json
      - name: Keep the count as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: good-builds
          path: good-builds.json
          if-no-files-found: warn
          retention-days: 90
