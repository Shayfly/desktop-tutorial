name: Pipeline identity vs baseline

# Michael 2026-11-10 fix 1: with every flag off, the gate code (the import closure of the frozen gate files and the
# behavioural runner, as ASTs) and everything the pipeline tells its models must equal the baseline commit. The
# baseline is computed HERE, by the same interpreter, from a worktree of that commit -- never a stored hash.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Michael 2026-11-10: the coverage check (SourceIdentity, incl. test_the_two_checks_cover_every_gate_input)
    # found gaps twice on PRs -- run it nightly on main too, to catch drift between PRs.
    - cron: '17 2 * * *'

permissions:
  contents: read

env:
  BASELINE_SHA: 2c1d6cb4cb0565df8f6fc0634218c1f98ea7fb49

jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The baseline commit is present (a shallow clone would fail on environment, not code)
        run: |
          if ! git cat-file -e "${BASELINE_SHA}^{commit}" 2>/dev/null; then
            echo "::error title=baseline missing::commit ${BASELINE_SHA} is not in this clone (fetch-depth must be 0); nothing was compared"
            exit 1
          fi
      - name: Additive only -- every line deleted from the baseline is declared
        run: |
          set -euo pipefail
          git diff --numstat "$BASELINE_SHA" HEAD | awk '$2 != "0" && $2 != "-" {print $3}' > "$RUNNER_TEMP/deleted.txt"
          python3 - "$RUNNER_TEMP/deleted.txt" <<'PY'
          import json, sys
          deleted = [l.strip() for l in open(sys.argv[1]) if l.strip()]
          allowed = json.load(open("docs/identity/allowed-deletions.json"))["allowed"]
          # Michael fix 4: a declaration is not a self-waiver -- each needs a reviewer who is not the author.
          bad, unreviewed = [], []
          for p in deleted:
              d = allowed.get(p)
              if not isinstance(d, dict) or not d.get("reason"):
                  bad.append(p)
                  continue
              who = str(d.get("reviewer") or "").strip()
              if not who or who.lower() in ("claude", "author", "pending") or who == d.get("author"):
                  unreviewed.append(p)
              print(f"::notice title=deletion::{p}: {d.get('reason')} (author {d.get('author')}, reviewer {who or 'NONE'})")
          if bad:
              print(f"::error title=additive only::lines deleted from the baseline in {', '.join(bad)} without a declared reason")
          if unreviewed:
              print(f"::error title=additive only::deletions in {', '.join(unreviewed)} have no reviewer note (a reviewer other than the author must sign in docs/identity/allowed-deletions.json)")
          if bad or unreviewed:
              sys.exit(1)
          print(f"::notice title=additive only::{len(deleted)} file(s) with deletions, all declared and reviewed")
          PY
      - name: Baseline manifests from a worktree of the baseline commit
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base" "$BASELINE_SHA"
          cp omni_prod/pipeline_identity.py "$RUNNER_TEMP/base/omni_prod/"
          (cd "$RUNNER_TEMP/base" && OMNI_SITE_AUTH_V2=0 python -m omni_prod.pipeline_identity --source > "$RUNNER_TEMP/base-source.json" \
             && OMNI_SITE_AUTH_V2=0 python -m omni_prod.pipeline_identity > "$RUNNER_TEMP/base-digest.txt")
          echo "::notice title=baseline::$(cat "$RUNNER_TEMP/base-digest.txt") at ${BASELINE_SHA:0:7}"
      - name: This commit, flag off, equals the baseline
        env:
          BASELINE_SOURCE_MANIFEST: ${{ runner.temp }}/base-source.json
          OMNI_SITE_AUTH_V2: '0'
        run: |
          set -euo pipefail
          head=$(python -m omni_prod.pipeline_identity)
          base=$(cat "$RUNNER_TEMP/base-digest.txt")
          if [ "$head" = "$base" ]; then echo "::notice title=behavioural identity::$head equals the baseline"; \
          else echo "::error title=behavioural identity::$head != baseline $base"; exit 1; fi
          python -m unittest tests.test_site_auth_v2.SourceIdentity -v
          python - <<'PY'
          from omni_prod.pipeline_identity import source_manifest
          m = source_manifest()
          for path, s in sorted(m["stripped"].items()):
              level = "warning" if s["lines"] > 60 else "notice"
              print(f"::{level} title=stripped {path}::{s['blocks']} blocks, {s['lines']} lines"
                    + (" -- over 60 lines in one file: read the flag-only code by eye" if level == "warning" else ""))
          PY
