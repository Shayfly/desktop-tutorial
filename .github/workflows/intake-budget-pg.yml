name: intake-budget-pg

# Issue #12: the intake budget reservation tests need a REAL PostgreSQL (and
# Redis/RQ for duplicate delivery). They skip without one, so this job
# provides both services and FAILS if any of them was skipped -- a skipped
# concurrency test must never look like a pass. No secrets, no provider calls.
on:
  pull_request:
  push:
    branches: [main, milestone/pre-staging-2026-10-05]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Classify changed files (unknown diffs run heavy checks)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_scope.py
  pg-tests:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      M4D2_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
      OMNI_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Apply repository migrations (plan-governed execution needs agent_tasks, 034+)
        timeout-minutes: 3
        env:
          OMNI_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
        run: python -m omni_prod.migrate
      - name: Focused PostgreSQL, Redis and build-idempotency regressions
        timeout-minutes: 12
        env:
          OMNI_EVIDENCE_NOTICES: ${{ github.workspace }}/evidence-notices.txt
        run: |
          python -m pytest -q -rs --junitxml=intake-pg.xml \
            tests/test_intake_budget_pg.py tests/test_intake_complexity.py tests/test_venice_in_conversation.py \
            tests/test_intake_requirements_preservation.py tests/test_intake_worker_route.py \
            tests/test_intake_assistant_he.py tests/test_plan_driven_execution.py tests/test_no_repeat_questions.py \
            tests/test_visual_edit.py tests/test_conversation_ux.py tests/test_worker_build_not_found.py tests/test_reservation_reconciler_pg.py tests/test_failed_build_release_pg.py tests/test_settle_computed_pg.py tests/test_founder_cap_exempt_pg.py tests/test_failed_builds_off_cap_pg.py tests/test_queue_position_pg.py tests/test_first_agent_brief_slice_pg.py \
            tests/test_worker_deploy_recovery.py tests/test_migration_rollback_tolerance.py tests/test_live_core_migration.py \
            tests/test_reference_store_pg.py tests/test_company_loss_failed_build_pg.py \
            tests/test_corpus_pages_migration.py tests/test_worker_alert.py \
            tests/test_first_pass_yield.py \
            tests/test_evidence_export.py tests/test_real_docker_drain_recovery.py \
            tests/integration/test_m5_build_economics_postgres.py tests/test_intake_approve_and_goal.py \
            tests/test_discovery_and_approval.py::LiveBriefAndApprovalTests::test_approval_is_consumed_once \
            tests/test_discovery_and_approval.py::LiveBriefAndApprovalTests::test_one_approval_never_starts_two_builds
      # Warehouse 112 (owner 2026-11-16): the PostgreSQL test files no job ran before. In the focused list above they
      # broke three files that ran there before (module and environment state leaked between files: the interpreter
      # label read 'model-via-worker', the API answered 500), so each runs in its own process. A skip is a failure here.
      # A file that cannot run yet is in tests/pg_not_yet_run.txt with its reason (scripts/ci_test_coverage.py).
      - name: PostgreSQL files no job ran before (warehouse 112), each in its own process
        if: always()
        timeout-minutes: 12
        run: |
          fail=0
          for f in tests/test_actual_cost_settlement.py tests/test_agent_os.py tests/test_build_cancel_and_log.py \
                   tests/test_build_state_machine.py \
                   tests/test_conversation_turn_cap_pg.py \
                   tests/test_rate_limits_pg.py \
                   tests/test_contract_scope_lineage_pg.py \
                   tests/test_media_reading_128_pg.py \
                   tests/test_crash_recovery_and_change_parity.py tests/test_golden_mod_path_live_postgres.py \
                   tests/test_intelligence_plane.py tests/test_janitor_redispatch.py tests/test_m4d2_live_fastapi_redis.py \
                   tests/test_m4d2_live_postgres.py \
                   tests/test_maintenance_live_postgres.py tests/test_preview_access.py tests/test_release_policy.py; do
            n=$(basename "$f" .py)
            if python -m pytest -q -rs -p no:cacheprovider --junitxml="pg112-$n.xml" "$f"; then
              echo "::notice title=pg 112::PASS $f"
            else
              echo "::error title=pg 112::FAIL $f (run alone in its own process)"; fail=1
            fi
          done
          python - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          skipped = []
          for path in sorted(glob.glob('pg112-*.xml')):
              for c in ET.parse(path).getroot().iter('testcase'):
                  if c.find('skipped') is not None:
                      skipped.append(f"{path}: {c.get('classname')}.{c.get('name')}")
          for s in skipped:
              print(f'::error title=pg 112 skipped::{s}')
          sys.exit(1 if skipped else 0)
          PY
          exit $fail
      - name: Evidence notices (readable as check-run annotations, no log access needed)
        if: always()
        run: cat evidence-notices.txt 2>/dev/null || echo "::warning title=evidence::no evidence notices were written"
      # 2026-11-16: 4m39s on main after #415 (the skill-gate specs run real engine builds), against a 5-minute bound
      # 2026-11-17: over 10 minutes on #426 (five new specs); the job's own limit is 20 and its tests take about 4
      - name: Negative controls (one SPEC ::notice per spec; the same runner as v24-ci)
        if: always()
        timeout-minutes: 14
        env:
          NC_ENV: pg      # compare with each control's expect_failed_pg; extra failures here are INFO, not FAIL
          # 2026-11-17: the limit was raised 5 -> 10 -> 14 and still ran over (main 8:56-11:37; a branch over 14). Not
          # raised again: 3 controls at once, each worker on its own copy of this database and its own Redis index.
          NC_JOBS: "3"
          # 2026-11-22: #499 ran out at 14:00 with every control PASS. v24-ci runs every control; here only the ones a
          # real database changes: envs names pg, expect_failed_pg, or a target test reaches Postgres/Redis (94 of 876).
          NC_SCOPE: declared
          NC_DB_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres
          NC_REDIS_URL: redis://127.0.0.1:6379/0
        run: python scripts/run_negative_controls.py
      - name: No test may be skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          cases = list(ET.parse('intake-pg.xml').getroot().iter('testcase'))
          skipped = [f"{c.get('classname')}.{c.get('name')}" for c in cases if c.find('skipped') is not None]
          print(f'{len(cases)} test cases, {len(skipped)} skipped')
          for s in skipped:
              print(f'::error title=skipped::{s}')
          sys.exit(1 if skipped or not cases else 0)
          PY
      # 2026-10-28 (#82, extended): the job log is not readable from the agent environment. Every failed or errored
      # test is printed as a ::notice with its exact pytest id, so a reviewer reads WHICH test failed from the check-run
      # annotations without downloading the artifact. Known flake: test_real_docker_drain_recovery.py::test_5 (see
      # SMELLS.md, #150); its OOM assertion is not touched here.
      - name: Failed tests as annotations (one ::notice per failed test)
        if: always()
        run: |
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists('intake-pg.xml'):
              print('::notice title=pg failed test::no junit report was written (pytest did not finish)')
              raise SystemExit(0)
          failed = 0
          for c in ET.parse('intake-pg.xml').getroot().iter('testcase'):
              for bad in list(c.iter('failure')) + list(c.iter('error')):
                  failed += 1
                  test_id = (c.get('file') or c.get('classname', '').replace('.', '/') + '.py') + '::' + c.get('name', '')
                  msg = ' '.join((bad.get('message') or '').split())[:300].replace('%', '%25')
                  print(f"::notice title=pg failed test::{test_id} ({bad.tag}) {msg}")
          print(f'::notice title=pg failed tests::{failed} failed or errored')
          PY
      # 2026-10-20: keep the junit report on every outcome (the step above reads it; the artifact is the full record).
      - name: Upload the junit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: intake-pg-junit
          path: intake-pg.xml
          if-no-files-found: warn
          retention-days: 14
  pg:
    # Preserve the required check name and fail closed if classification fails.
    needs: [changes, pg-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require PostgreSQL and Docker success or an explicit documentation-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          TEST_RESULT: ${{ needs.pg-tests.result }}
        run: python scripts/ci_scope.py --verify-gate
