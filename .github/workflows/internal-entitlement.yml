name: Internal entitlement

# Grants, revokes or lists the INTERNAL_QA / staging entitlement (founder
# decision 2026-10-07 #24). Runs manually on the worker host, which already
# holds the database credentials; GitHub keeps who ran it, when and with what
# inputs. The command prints entitlement and account ids only.
#
# GitHub only offers "Run workflow" (and the dispatch API) for a workflow that
# is on the default branch or has run at least once. The push trigger below
# runs it once, read-only (`list`), when this file changes on the build branch.
on:
  workflow_dispatch:
    inputs:
      action:
        description: grant, revoke or list
        type: choice
        options: [grant, revoke, list]
        required: true
      email:
        description: 148AI account email (not needed for list)
        required: false
      reason:
        description: Why (required for grant and revoke)
        required: false
  push:
    branches: [milestone/pre-staging-2026-10-05]
    paths: [.github/workflows/internal-entitlement.yml]

concurrency:
  group: internal-entitlement
  cancel-in-progress: false

jobs:
  entitlement:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Write environment file
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          WORKER_ENV_OVERRIDES: ${{ secrets.WORKER_ENV_OVERRIDES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash infra/worker-host/write-env.sh

      - name: Apply database migrations
        working-directory: infra/worker-host
        run: docker compose run --rm --no-deps worker python -m omni_prod.migrate

      - name: Run
        working-directory: infra/worker-host
        env:
          ACTION: ${{ inputs.action || 'list' }}
          EMAIL: ${{ inputs.email }}
          REASON: ${{ inputs.reason }}
          ACTOR: ${{ github.actor }}
        # The outcome (ids and refusal reasons only, never emails or secrets)
        # is also published as an annotation, readable without the job log.
        run: |
          set -uo pipefail
          # GitHub runs this with `bash -e`: capture the exit code instead of
          # letting errexit end the step before the reason is published.
          rc=0
          if [ "$ACTION" = "list" ]; then
            docker compose run --rm --no-deps -T worker python -m omni_prod.entitlements list > out.txt 2> err.txt || rc=$?
          else
            docker compose run --rm --no-deps -T worker python -m omni_prod.entitlements "$ACTION" \
              --email "$EMAIL" --reason "$REASON" --by "github:$ACTOR" > out.txt 2> err.txt || rc=$?
          fi
          cat out.txt; cat err.txt >&2
          if [ "$rc" -ne 0 ]; then
            # Last few non-empty lines (docker compose may add its own lines).
            tr -d '\r' < err.txt | grep -v '^[[:space:]]*$' | tail -n 4 \
              | while IFS= read -r line; do echo "::error title=entitlement $ACTION::$line"; done
            exit "$rc"
          fi
          echo "::notice title=entitlement $ACTION::$(tr '\n' ' ' < out.txt | cut -c1-900)"
