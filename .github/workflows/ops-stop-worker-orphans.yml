name: ops stop crash-looping worker; list orphans; reconciler dry run (branch only)

# Founder 2026-11-01 00:02. Upstash quota is exhausted (500000/500000); worker restarts every ~1s (1010 restarts).
# Run 1 (41246413919): stopped `worker`; listed orphans; reconciler dry run.
# Run 2 (founder 2026-11-01 00:55):
#  1. docker compose stop preview-worker intake-worker (both crash-looping on the same Redis quota).
#  2. exactly two build_jobs, QUEUED -> CANCELLED through PostgresBuildRepository.transition (the state machine),
#     error_code=orphaned_queue_lost. Nothing else is written; any other row or state is refused.
#  3. READ-ONLY: reservation_reconciler dry run (no --apply).
# Run 3 (founder 2026-11-01 01:06): reservation_reconciler --apply on the three rows of run 2's dry run, then a
# dry run that must return ZERO rows. Nothing else: no stop, no start, no deploy. One ::notice per output line.
# No checkout (it would clean the workspace that holds the deploy-generated .env). No Redis command is sent.
on:
  push:
    branches: [ops/stop-worker-orphans-20261101]

concurrency:
  group: ops-worker-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 10
    steps:
      - name: Locate the compose project (read-only)
        id: wd
        shell: bash
        run: |
          set -euo pipefail
          wd=$(docker inspect omni-worker-worker-1 --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')
          echo "wd=$wd" >> "$GITHUB_OUTPUT"

      - name: reservation_reconciler --apply
        shell: bash
        working-directory: ${{ steps.wd.outputs.wd }}
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T worker python -m omni_prod.reservation_reconciler --apply > /tmp/ops-apply.out 2>&1
          rc=$?
          sed -E 's#://[^@/[:space:]]*@#://<redacted>@#g' /tmp/ops-apply.out | tail -40 | while IFS= read -r line; do
            [ -n "$line" ] || continue; line=${line//%/%25}
            if [ "$rc" = 0 ]; then echo "::notice title=reconciler apply::${line:0:3400}"; else echo "::error title=reconciler apply (rc=$rc)::${line:0:3400}"; fi
          done
          rm -f /tmp/ops-apply.out
          exit $rc

      - name: reservation_reconciler dry run after apply (must be zero rows)
        shell: bash
        working-directory: ${{ steps.wd.outputs.wd }}
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T worker python -m omni_prod.reservation_reconciler > /tmp/ops-recon.out 2>&1
          rc=$?
          sed -E 's#://[^@/[:space:]]*@#://<redacted>@#g' /tmp/ops-recon.out | tail -40 | while IFS= read -r line; do
            [ -n "$line" ] || continue; line=${line//%/%25}
            if [ "$rc" = 0 ]; then echo "::notice title=reconciler::${line:0:3400}"; else echo "::error title=reconciler (rc=$rc)::${line:0:3400}"; fi
          done
          grep -q 'reservation_reconciler: 0 terminal RESERVED row(s)' /tmp/ops-recon.out || { echo "::error title=reconciler::dry run after apply is NOT zero rows"; rc=${rc/#0/1}; }
          rm -f /tmp/ops-recon.out
          exit $rc
