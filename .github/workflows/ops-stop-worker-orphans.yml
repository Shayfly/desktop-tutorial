name: ops stop crash-looping worker; list orphans; reconciler dry run (branch only)

# Founder 2026-11-01 00:02. Upstash quota is exhausted (500000/500000); worker restarts every ~1s (1010 restarts).
#  1. docker compose stop worker -- the ONLY write to the host. No deploy, no file change, no other service touched.
#  2. READ-ONLY: every build_jobs row still queued/running, and every credit reservation still RESERVED.
#  3. READ-ONLY: python -m omni_prod.reservation_reconciler (dry run, no --apply).
# No checkout (it would clean the workspace that holds the deploy-generated .env). No Redis command is sent.
on:
  push:
    branches: [ops/stop-worker-orphans-20261101]

concurrency:
  group: ops-worker-host
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ops:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 10
    steps:
      - name: Stop the crash-looping worker (docker compose stop worker)
        id: stop
        shell: bash
        run: |
          set -euo pipefail
          c=$(docker ps -a --format '{{.Names}}' | grep -E '^omni-worker-worker-1$' | head -1 || true)
          [ -n "$c" ] || { echo "::error title=stop::container omni-worker-worker-1 not found"; exit 2; }
          wd=$(docker inspect "$c" --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}')
          before=$(docker inspect "$c" --format 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}}')
          cd "$wd"
          docker compose stop worker
          after=$(docker inspect "$c" --format 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} finished={{.State.FinishedAt}}')
          echo "::notice title=worker stopped::before: $before | after: $after"
          echo "wd=$wd" >> "$GITHUB_OUTPUT"
          sleep 20
          again=$(docker inspect "$c" --format 'status={{.State.Status}} restarts={{.RestartCount}}')
          echo "::notice title=worker 20s later::$again"
          # the other services, untouched: are they also restarting?
          echo "::notice title=other services (not touched)::$(docker ps -a --filter label=com.docker.compose.project.working_dir="$wd" --format '{{.Names}} {{.Status}}' | tr '\n' ';')"

      - name: Orphan build_jobs and RESERVED reservations (read-only SELECTs)
        shell: bash
        working-directory: ${{ steps.stop.outputs.wd }}
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T worker python - <<'PY' 2>&1 | tee /tmp/ops-orphans.out
          import json, os, psycopg
          def note(t, b):
              b = str(b).replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:3400]
              print(f'::notice title={t}::{b}', flush=True)
          with psycopg.connect(os.environ['OMNI_DATABASE_URL'], connect_timeout=10) as conn:
              conn.read_only = True
              rows = conn.execute(
                  "SELECT id, status, phase, project_id, created_at, started_at, heartbeat_at, cancel_requested_at "
                  "FROM build_jobs WHERE status IN ('queued', 'running') ORDER BY created_at").fetchall()
              note(f'build_jobs queued/running: {len(rows)}', '\n'.join(
                  f'{r[0]} status={r[1]} phase={r[2]} project={r[3]} created={r[4]:%Y-%m-%d %H:%M} '
                  f'started={r[5]} heartbeat={r[6]} cancel_req={r[7]}' for r in rows) or '(none)')
              res = conn.execute(
                  "SELECT cr.build_id, cr.status, cr.created_at, b.status, m.status, "
                  "to_jsonb(cr) - 'build_id' - 'status' - 'created_at' "
                  "FROM credit_reservations cr LEFT JOIN build_jobs b ON b.id = cr.build_id "
                  "LEFT JOIN modification_requests m ON m.id = cr.build_id "
                  "WHERE cr.status = 'RESERVED' ORDER BY cr.created_at").fetchall()
              note(f'credit_reservations RESERVED: {len(res)}', '\n'.join(
                  f'{r[0]} created={r[2]:%Y-%m-%d %H:%M} build={r[3]} modification={r[4]} {json.dumps(r[5], default=str)[:400]}'
                  for r in res) or '(none)')
          PY
          rc=${PIPESTATUS[0]}
          grep -q '^::notice title=credit_reservations' /tmp/ops-orphans.out || {
            echo "::error title=orphans query failed (rc=$rc)::$(tail -25 /tmp/ops-orphans.out | sed -E 's#://[^@/[:space:]]*@#://<redacted>@#g' | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | cut -c1-3400)"; exit 1; }
          rm -f /tmp/ops-orphans.out

      - name: reservation_reconciler dry run (no --apply)
        shell: bash
        working-directory: ${{ steps.stop.outputs.wd }}
        run: |
          set -uo pipefail
          docker compose run --rm --no-deps -T worker python -m omni_prod.reservation_reconciler > /tmp/ops-recon.out 2>&1
          rc=$?
          body=$(sed -E 's#://[^@/[:space:]]*@#://<redacted>@#g' /tmp/ops-recon.out | tail -40 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | cut -c1-3400)
          if [ "$rc" = 0 ]; then echo "::notice title=reconciler dry run (rc=0)::$body"; else echo "::error title=reconciler dry run (rc=$rc)::$body"; fi
          rm -f /tmp/ops-recon.out
          exit $rc
