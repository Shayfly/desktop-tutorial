name: path-ownership

# The owner, 2026-11-22 (evening): the platform UI moves to Claude Code and Codex does not continue it; a codex/ or
# design/ branch changes neither the platform UI shell nor the customers' sites' engine (OWNERS.md).
# scripts/path_ownership.py reads the branch prefix and the changed paths.
on:
  pull_request:

permissions:
  contents: read

jobs:
  path-ownership:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: No agent changes the other's paths
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/path_ownership.py "$HEAD_REF" "origin/$BASE_REF"
