name: Post-deploy checks

# Founder approval 2026-10-09 13:38: verify the deployed pre-staging system on
# the real infrastructure before anything is called LIVE. Synthetic account and
# data only (qa-postdeploy-*@example.com). Never prints secrets.
#   stage=free   $0: migrations, builder health, existing versions intact,
#                demo/publish refused, preview + persistent data (restart and
#                new version), queued and running stop, journal.
#   stage=paid   one real build, model spend hard-capped by max_usd (one-off
#                worker with OMNI_EXTERNAL_BUDGET_USD), then build evidence,
#                settlement, preview, acceptance, restart.
# The build worker is stopped (drained) only while builds are being set up and
# is always started again.
on:
  workflow_dispatch:
    inputs:
      stage:
        description: free or paid
        type: choice
        options: [free, paid, crash, cancel-build, inspect-build]
        required: true
      build_id:
        description: "cancel-build / inspect-build: the synthetic build id"
        required: false
        default: ""
      max_usd:
        description: Hard model-spend ceiling for the paid build
        required: false
        default: "0.15"
  push:
    branches: [milestone/pre-staging-2026-10-05]
    paths: [.github/workflows/postdeploy-checks.yml]

concurrency:
  group: postdeploy-checks
  cancel-in-progress: false

jobs:
  checks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 45
    defaults:
      run:
        working-directory: /home/omni/actions-runner/_work/desktop-tutorial/desktop-tutorial/infra/worker-host
    steps:
      - name: Prepare
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pd" && chmod 777 "$RUNNER_TEMP/pd"
          echo "IMG=$(docker inspect --format '{{.Image}}' "$(docker compose ps -q worker)")" >> "$GITHUB_ENV"
          echo "SANDBOX_HEALTH=$(docker compose exec -T worker python -c "import urllib.request;print(urllib.request.urlopen('http://sandbox-runner:8010/health',timeout=5).status)" 2>/dev/null || echo down)" >> "$GITHUB_ENV"
          echo "deployed=$(git -C ../.. rev-parse HEAD)"
          # The API's QA-funding settings as configured on the Vercel preview
          # environment (plain values, no secrets), so the local API decides
          # like the deployed one.
          echo "QA_ENV=-e OMNI_ENV=staging -e OMNI_QA_BUILD_MAX_USD=0.50 -e OMNI_QA_BUDGET_TOTAL_USD=10 -e OMNI_QA_BUDGET_SINCE=2026-10-08T17:12:00Z" >> "$GITHUB_ENV"

      - name: Free checks
        if: inputs.stage == 'free'
        run: |
          set -uo pipefail
          run() { docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres $QA_ENV \
                    -e POSTDEPLOY_SANDBOX_HEALTH="$SANDBOX_HEALTH" -v "$RUNNER_TEMP/pd:/out" "$IMG" \
                    python -m omni_prod.postdeploy_checks "$1" 2>&1 | grep -E '^(::|POSTDEPLOY|Traceback|[A-Za-z]+Error)' ; }
          rc=0
          run free || rc=1
          docker compose stop -t 1500 worker
          run cancel-setup || rc=1
          docker compose start worker
          run cancel-verify || rc=1
          exit $rc

      - name: Paid build
        if: inputs.stage == 'paid'
        env:
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          set -uo pipefail
          run() { docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres $QA_ENV \
                    -v "$RUNNER_TEMP/pd:/out" "$IMG" python -m omni_prod.postdeploy_checks "$1" 2>&1 \
                    | grep -E '^(::|POSTDEPLOY|Traceback|[A-Za-z]+Error)' ; }
          docker compose stop -t 1500 worker
          rc=0
          run paid-create || rc=1
          BID=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/pd/state.json')).get('paid_build',''))")
          if [ -n "$BID" ] && [ "$rc" = 0 ]; then
            echo "::notice title=postdeploy paid build::running $BID in a one-off worker, model ceiling \$$MAX_USD"
            docker compose run --rm --no-deps -T -e OMNI_EXTERNAL_BUDGET_USD="$MAX_USD" -e BID="$BID" worker \
              python -c 'import os; from omni_prod.worker_tasks import execute_live_build_job as e; e(os.environ["BID"])' 2>&1 \
              | sed -E 's/(AIza|sk-ant-|sk-)[0-9A-Za-z_-]{16,}/[redacted]/g' | grep -E '^(Traceback|[A-Za-z]+Error)' | tail -5 || true
          fi
          docker compose start worker
          run paid-verify || rc=1
          exit $rc

      - name: Crash recovery (kill the build worker mid-build)
        if: inputs.stage == 'crash'
        run: |
          set -uo pipefail
          run() { docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres $QA_ENV \
                    -v "$RUNNER_TEMP/pd:/out" "$IMG" python -m omni_prod.postdeploy_checks "$1" 2>&1 \
                    | grep -E '^(::|POSTDEPLOY|Traceback|[A-Za-z]+Error)' ; }
          rc=0
          run crash-create || rc=1
          echo "::notice title=postdeploy crash::killing the build worker (SIGKILL, no drain)"
          docker kill "$(docker compose ps -q worker)" >/dev/null
          docker compose start worker
          sleep 170  # the killed worker's registration (ttl 135 s) must expire first
          docker compose run --rm --no-deps -T janitor python -c \
            'import json; from omni_prod.maintenance import recover_now; print("::notice title=postdeploy recovery pass::" + json.dumps(recover_now(1)))'
          run crash-verify || rc=1
          exit $rc

      - name: Cancel one synthetic build
        if: inputs.stage == 'cancel-build'
        env:
          BID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres -e BID="$BID" "$IMG" python -c '
          import os
          from omni_prod.investor_app import _v28, _v28_pool
          from omni_prod.job_repository import PostgresBuildRepository
          bid = os.environ["BID"]
          with _v28_pool.connection() as c:
              key = c.execute("SELECT project_id FROM build_jobs WHERE id = %s", (bid,)).fetchone()[0]
          out = PostgresBuildRepository(_v28_pool).request_cancel(bid, key, requested_by="postdeploy-cleanup")
          if out == "cancelled":
              _v28.subscriptions.release(build_id=bid)
          with _v28_pool.connection() as c:
              row = c.execute("SELECT b.status, r.status FROM build_jobs b LEFT JOIN credit_reservations r ON r.build_id = b.id WHERE b.id = %s", (bid,)).fetchone()
          print(f"::notice title=postdeploy cancel-build::{bid} outcome={out} build={row[0]} reservation={row[1]}")
          '

      - name: Inspect one build (read-only)
        if: inputs.stage == 'inspect-build'
        env:
          BID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          docker run --rm --network host --env-file .env -e OMNI_CREATOR_PERSISTENCE=postgres -e BID="$BID" "$IMG" python -c '
          import os, json
          from omni_prod.investor_app import _v28_pool
          bid = os.environ["BID"]
          def note(t, m):
              print(f"::notice title={t}::" + str(m)[:3800].replace("%", "%25").replace("\n", "%0A"))
          with _v28_pool.connection() as c:
              ev = c.execute("SELECT evidence_json FROM build_jobs WHERE id = %s", (bid,)).fetchone()[0] or {}
              r = c.execute("SELECT status, estimated_provider_cost_usd, actual_provider_cost_usd, settled_provider_cost_usd FROM credit_reservations WHERE build_id = %s", (bid,)).fetchone()
          note("spend", {k: ev.get(k) for k in ("provider_spend_usd", "external_model_calls", "provider_spend_basis", "billing", "model_budget_binding", "economics_settlement")} | {"reservation": [str(x) for x in r]})
          note("provider usage", json.dumps(ev.get("provider_usage"), default=str))
          for pid, rep in (ev.get("web_saas_acceptance_reports") or {}).items():
              checks = rep.get("checks", [])
              note("acceptance " + pid, json.dumps({"status": rep.get("status"), "summary": rep.get("summary"), "checks": checks}, ensure_ascii=False, default=str))
          '

      - name: Always restart the build worker
        if: always()
        run: docker compose start worker >/dev/null 2>&1 || true
