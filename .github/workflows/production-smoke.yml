name: Production Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify live production API
        env:
          BASE_URL: https://148aiv28.vercel.app
        shell: bash
        run: |
          exec > >(tee /tmp/report.txt) 2>&1
          python3 - <<'PY'
          import http.cookiejar
          import json
          import os
          import secrets
          import sys
          import time
          import urllib.error
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          rows = []

          def request(method, path, payload=None):
              headers = {"Accept": "application/json"}
              data = None
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
                  headers["Content-Type"] = "application/json"
              req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
              try:
                  resp = opener.open(req, timeout=25)
              except urllib.error.HTTPError as exc:
                  resp = exc
              except Exception as exc:
                  print(f"{method} {path}\nHTTP: NO_RESPONSE\nERROR: {type(exc).__name__}: {exc}", flush=True)
                  return None, None, {}
              with resp:
                  status = resp.status
                  body = resp.read().decode("utf-8", errors="replace")
                  header_map = dict(resp.headers.items())
              # Protect session secrets in GitHub Actions logs while keeping
              # the server's JSON response otherwise unmodified.
              try:
                  parsed = json.loads(body)
                  if isinstance(parsed, dict):
                      for key in ("token", "access_token", "refresh_token"):
                          value = parsed.get(key)
                          if isinstance(value, str) and value:
                              print("::add-mask::" + value, flush=True)
              except (ValueError, TypeError):
                  pass
              # Never persist live session tokens in a committed report.
              try:
                  safe = json.loads(body)
                  if isinstance(safe, dict):
                      for key in ("token", "access_token", "refresh_token"):
                          if key in safe:
                              safe[key] = "[REDACTED]"
                      report_body = json.dumps(safe, ensure_ascii=False)
                  else:
                      report_body = body
              except (ValueError, TypeError):
                  report_body = body
              print(f"{method} {path}\\nHTTP: {status}\\nBODY_RAW: {report_body}", flush=True)
              return status, body, header_map

          def check(name, actual, ok):
              result = "PASS" if ok else "FAIL"
              rows.append((name, result, str(actual)))
              print(f"CHECK {name}: {result}", flush=True)

          status, body, _ = request("GET", "/api/v28/deployment")
          try:
              schema = json.loads(body)["schema"]
              schema_ok = (schema.get("compatible") is True and schema.get("missing") == [])
          except (TypeError, ValueError, KeyError, AttributeError):
              schema_ok = False
          check("deployment schema", status, status == 200 and schema_ok)

          status, body, _ = request("GET", "/api/v28/me")
          check("unauthenticated me", status, status == 401)

          suffix = str(int(time.time())) + "-" + secrets.token_hex(6)
          credentials = {"email": "smoke+" + suffix + "@smoke.148ai.local",
                         "password": "Sm0ke!" + secrets.token_urlsafe(24)}
          # The application currently defines these endpoints under /auth/.
          status, body, _ = request("POST", "/api/v28/auth/login", credentials)
          if status == 200:
              print("PATH: login-200-skip-register", flush=True)
              check("register", "skipped, login " + str(status), True)
          else:
              print("PATH: login-not-200-register", flush=True)
              status, body, _ = request("POST", "/api/v28/auth/register", credentials)
              check("register", status, status == 200)

          jar.clear()
          status, body, hdr = request("POST", "/api/v28/auth/login", credentials)
          has_cookie = bool([cookie for cookie in jar if cookie.name == "148ai_session"])
          check("login and Set-Cookie", status, status == 200 and has_cookie)

          status, body, _ = request("GET", "/api/v28/me")
          check("authenticated me", status, status == 200)

          print("\n| Test | PASS/FAIL | HTTP |\n|---|---|---|")
          for name, result, http in rows:
              print(f"| {name} | {result} | {http} |")
          sys.exit(1 if len(rows) != 5 or any(row[1] != "PASS" for row in rows) else 0)
          PY
          rc=$?
          sync
          sleep 1
          exit $rc

      - name: summary
        if: always()
        shell: bash
        run: |
          echo "## Production Smoke — $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/report.txt ]; then cat /tmp/report.txt >> "$GITHUB_STEP_SUMMARY"; else echo "No report generated" >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: publish results
        if: always()
        shell: bash
        run: |
          if [ ! -s /tmp/report.txt ]; then echo "report empty"; exit 1; fi
          mkdir -p smoke
          { echo "# Production Smoke — $(date -u +%FT%TZ)"; echo; echo "run: $GITHUB_RUN_ID"; echo '```'; if [ -f /tmp/report.txt ]; then grep -v '^::add-mask::' /tmp/report.txt || true; else echo "No report generated"; fi; echo '```'; } > smoke/last-run.md
          git config user.name "smoke-bot"
          git config user.email "smoke-bot@148ai.dev"
          git add smoke/last-run.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: smoke results [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
