name: Registry snapshot and sync
'on':
  push:
    branches:
      - fix/docker-oom-rehearsal-20261013
  pull_request:
    branches:
      - milestone/pre-staging-2026-10-05
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Recompute evidence without changing deployed systems
        run: python -m omni_prod.agent_os.audit --write
      - name: Save generated files for independent review
        uses: actions/upload-artifact@v4
        with:
          name: agent-os-registry-generated
          path: |
            AGENT_OS_REGISTRY.json
            docs/AGENT_OS_REGISTRY.md
            PLATFORM_*_MATRIX.json
            GOLDEN_E2E_MATRIX.json
            FAILURE_INJECTION_MATRIX.json
            TRUTH_MATRIX.json
            docs/TRUTH_MATRIX.md
            omni_prod/registry_evidence_lock.json
            PLATFORM_TRUTH_MATRIX.json
          if-no-files-found: warn
      - name: Show changed paths
        run: git status --short
      - name: Commit generated evidence on internal fix branch
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "pull_request" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ] || [ "$HEAD_BRANCH" != "fix/docker-oom-rehearsal-20261013" ]; then
            echo "Read-only artifact for non-internal PR"; exit 0
          fi
          git add AGENT_OS_REGISTRY.json docs/AGENT_OS_REGISTRY.md omni_prod/registry_evidence_lock.json PLATFORM_CAPABILITY_MATRIX.json PLATFORM_REGRESSION_MATRIX.json GOLDEN_E2E_MATRIX.json FAILURE_INJECTION_MATRIX.json TRUTH_MATRIX.json docs/TRUTH_MATRIX.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(audit): synchronize computed registry snapshots"
            git push origin HEAD:fix/docker-oom-rehearsal-20261013
          fi
