name: Repo Control Health and CI Status
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: repo-control-health-status-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Probe public health and snapshot CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH_URL: https://one48ai-repo-control.onrender.com/health
        shell: bash
        run: |
          set -uo pipefail
          http_code="$(curl --silent --show-error --location --max-time 35 -o /tmp/repo-control-health.json --write-out '%{http_code}' "$HEALTH_URL")" || http_code="000"
          export HEALTH_HTTP_CODE="$http_code"
          # 2026-11-15: to the run's summary and annotations; main is protected and is never pushed to
          python3 scripts/ci_status_snapshot.py
