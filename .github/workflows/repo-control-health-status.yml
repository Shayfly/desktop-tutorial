name: Repo Control Health and CI Status
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: repo-control-health-status-main
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Probe public health and snapshot CI
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH_URL: https://one48ai-repo-control.onrender.com/health
        shell: bash
        run: |
          set -uo pipefail
          http_code="$(curl --silent --show-error --location --max-time 35 -o /tmp/repo-control-health.json --write-out '%{http_code}' "$HEALTH_URL")" || http_code="000"
          export HEALTH_HTTP_CODE="$http_code"
          python3 scripts/ci_status_snapshot.py
      - name: Commit report to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CI_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: refresh CI_STATUS snapshot [skip ci]"
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
