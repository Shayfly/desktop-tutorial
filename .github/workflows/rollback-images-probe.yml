name: rollback-images-probe (read-only)
# Read-only: do omni-rollback/<svc>:prev images exist, with a revision label,
# and do worker_tasks.py / model_gateway.py / preview_router.py hash the same
# as in the running consumer? Nothing is built, stopped, tagged or restarted.
on:
  push:
    branches: [ci/rollback-images-probe-2026-10-19]
    paths: [.github/workflows/rollback-images-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 5
    steps:
      - shell: bash
        run: |
          set -uo pipefail
          FILES="omni_prod/worker_tasks.py omni_prod/model_gateway.py omni_prod/preview_router.py"
          H='import hashlib,sys;from pathlib import Path;print(" ".join(hashlib.sha256(Path("/app",p).read_bytes()).hexdigest()[:12] for p in sys.argv[1:]))'
          for s in worker intake-worker intake-maintain preview-worker; do
            img="omni-rollback/$s:prev"
            if ! docker image inspect "$img" >/dev/null 2>&1; then echo "::warning title=rollback $s::$img MISSING"; continue; fi
            rev=$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$img" 2>/dev/null)
            created=$(docker image inspect -f '{{.Created}}' "$img")
            cid=$(docker ps -q -f "name=^/omni-worker-${s}-1$")
            run_h=$( [ -n "$cid" ] && docker exec "$cid" python -c "$H" $FILES 2>/dev/null || echo "no-running-container")
            img_h=$(docker run --rm --network none --entrypoint python "$img" -c "$H" $FILES 2>/dev/null || echo "cannot-read-image")
            v=$([ "$run_h" = "$img_h" ] && echo MATCH || echo MISMATCH)
            echo "::notice title=rollback $s::exists revision=${rev:-NONE} created=$created hashes=$v running=[$run_h] image=[$img_h]"
          done
          for s in worker intake-worker intake-maintain preview-worker; do
            cid=$(docker ps -q -f "name=^/omni-worker-${s}-1$"); [ -n "$cid" ] || { echo "::notice title=running $s::not running"; continue; }
            iid=$(docker inspect -f '{{.Image}}' "$cid"); docker image inspect "$iid" >/dev/null 2>&1 && st=present || st=MISSING
            info=$(docker inspect -f 'status={{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}} image={{.Config.Image}}' "$cid")
            budget=$(docker exec "$cid" printenv OMNI_EXTERNAL_BUDGET_USD 2>/dev/null || echo unset)
            echo "::notice title=running $s::container image object $st $info budget_env=$budget"
          done
          # 2026-10-19 16:45: who removes the running image objects? (read-only)
          echo "::notice title=images::$(docker images --format '{{.Repository}}:{{.Tag}} {{.ID}} {{.CreatedSince}}' | grep -E 'omni|worker' | tr '\n' ';' | head -c 900)"
          echo "::notice title=image-events::$(timeout 10 docker events --since 90m --until "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --filter type=image --format '{{.Time}} {{.Action}} {{.Actor.ID}} {{index .Actor.Attributes "name"}}' 2>&1 | grep -E 'delete|untag|prune' | tail -15 | tr '\n' ';' | head -c 900)"
          # 2026-10-19 18:10: why does "Confirm deployment scope" exit 255? (read-only, no checkout, names only)
          echo "::warning title=scope-paths::ws=$GITHUB_WORKSPACE exists=$([ -d "$GITHUB_WORKSPACE" ] && echo y || echo n) top=$(ls -A "$GITHUB_WORKSPACE" 2>&1 | head -c 300 | tr '\n' ' ') envs=$(ls -d "$(dirname "$GITHUB_WORKSPACE")"/*/infra/worker-host/.env 2>&1 | tr '\n' ' ')"
          for d in "$GITHUB_WORKSPACE" "$(dirname "$GITHUB_WORKSPACE")"/*; do [ -f "$d/infra/worker-host/.env" ] && { W=$d; break; }; done
          cd "${W:-/nonexistent}/infra/worker-host" 2>/dev/null && {
            echo "::warning title=scope-head::$(git -C "$W" rev-parse --short HEAD 2>&1) env_file=$([ -f .env ] && echo present || echo MISSING) env_staging=$(grep -cx 'OMNI_ENV=staging' .env 2>/dev/null) intake=$(grep -cx 'OMNI_INTAKE_MODEL=1' .env 2>/dev/null) compose=$(docker compose version --short 2>&1)"
            out=$(docker compose config --services 2>&1); rc=$?
            echo "::warning title=scope-config::rc=$rc $(printf '%s' "$out" | grep -v '=' | tr '\n' ' ' | head -c 600)"
          }
          # 2026-10-19 19:25: rehearsal 39280924963 finished its step but the job never completed on GitHub. Read its
          # output from the runner's own page logs (read-only; only ::notice/::error lines, already redacted by the step).
          D=/home/omni/actions-runner/_diag/pages
          f=$(grep -l 'title=outcome' "$D"/*.log 2>/dev/null | xargs -r ls -t 2>/dev/null | head -n 1)
          echo "::warning title=rehearsal-log::file=${f:-none} runner_busy=$(pgrep -fc 'Runner.Worker' 2>/dev/null)"
          [ -n "$f" ] && grep -E '::(notice|error)' "$f" | sed -E 's/^[^:]*(::(notice|error))/\1/; s/::notice /::warning /; s/::error /::warning /' | grep -v 'Node.js' | head -n 9
