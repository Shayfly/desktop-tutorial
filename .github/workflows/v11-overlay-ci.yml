name: V11 Overlay CI

on:
  pull_request:
  push:
    branches: [main, milestone/pre-staging-2026-10-05]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q omni_prod tests
      # C34 (owner + Matt 2026-10-21): the unit tests run with NO network at the operating-system level (a network
      # namespace with only loopback); a subprocess cannot get out either. Fails closed if no namespace can be made.
      - name: Allow unprivileged network namespaces (C34)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Unit tests (no network, C34)
        env:
          OMNI_TEST_REQUIRE_NETNS: '1'
        run: python tools/netns_run.py -- python -m unittest discover -s tests -v
      - name: Prepare compose environment template
        run: cp .env.example .env
      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config > /dev/null
        env:
          POSTGRES_PASSWORD: CHANGE_ME
          OMNI_DATABASE_URL: postgresql://omni:CHANGE_ME@postgres:5432/omni
          OMNI_S3_ACCESS_KEY: CHANGE_ME
          OMNI_S3_SECRET_KEY: CHANGE_ME
          OMNI_SANDBOX_RUNNER_URL: https://sandbox.invalid
          OMNI_LOCAL_MODEL_URL: https://model.invalid/v1
