name: V11 Overlay CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q omni_prod tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config > /dev/null
        env:
          POSTGRES_PASSWORD: test-postgres-password
          OMNI_DATABASE_URL: postgresql://omni:test-postgres-password@postgres:5432/omni
          OMNI_S3_ACCESS_KEY: test-access
          OMNI_S3_SECRET_KEY: test-secret-password
          OMNI_SANDBOX_RUNNER_URL: https://sandbox.invalid
          OMNI_LOCAL_MODEL_URL: https://model.invalid/v1
