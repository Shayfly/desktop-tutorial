name: V11 Overlay CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Compile
        run: python -m compileall -q omni_prod tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare compose environment template
        run: cp .env.example .env
      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config > /dev/null
        env:
          POSTGRES_PASSWORD: CHANGE_ME
          OMNI_DATABASE_URL: postgresql://omni:CHANGE_ME@postgres:5432/omni
          OMNI_S3_ACCESS_KEY: CHANGE_ME
          OMNI_S3_SECRET_KEY: CHANGE_ME
          OMNI_SANDBOX_RUNNER_URL: https://sandbox.invalid
          OMNI_LOCAL_MODEL_URL: https://model.invalid/v1
