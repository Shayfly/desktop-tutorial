name: V11 Overlay CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      # C31 (founder 2026-10-21): the registry enforces itself in this required check (C16). R4 compares with the
      # registry on main, so a canary row cannot be removed or swapped for "pending" without going red.
      # Boundary: the lint proves a canary row exists and names an existing test, not that the canary fails when the
      # control breaks (that is the drill).
      - name: Base registry from main (registry_lint R4)
        uses: actions/checkout@v4
        with:
          ref: main
          path: .base-main
          persist-credentials: false
          sparse-checkout: CONTROLS.json
          sparse-checkout-cone-mode: false
      - name: Registry lint (C31)
        run: python tools/registry_lint.py CONTROLS.json --base .base-main/CONTROLS.json
      - name: Compile
        run: python -m compileall -q omni_prod tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Prepare compose environment template
        run: cp .env.example .env
      - name: Validate production compose
        run: docker compose -f docker-compose.production.yml config > /dev/null
        env:
          POSTGRES_PASSWORD: CHANGE_ME
          OMNI_DATABASE_URL: postgresql://omni:CHANGE_ME@postgres:5432/omni
          OMNI_S3_ACCESS_KEY: CHANGE_ME
          OMNI_S3_SECRET_KEY: CHANGE_ME
          OMNI_SANDBOX_RUNNER_URL: https://sandbox.invalid
          OMNI_LOCAL_MODEL_URL: https://model.invalid/v1
