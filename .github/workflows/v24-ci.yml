name: v24-ci
"on": [push, pull_request]

concurrency:
  # push and pull_request runs of the same ref are separate groups; within a
  # group runs queue instead of cancelling each other.
  group: v24-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read      # default for every job; only publish-report gets write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - run: python -m compileall -q omni_prod tests
      - run: python -m pytest -q --junitxml=pytest-report.xml
      - name: Keep the test report for the published summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publish failing tests as annotations
        if: failure()
        # Job logs are not reachable from every review environment; annotations are.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('pytest-report.xml').getroot().iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  msg = (bad.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title={name}::{msg}")
          PY
      - name: Regression guardian (agent 48) -- every protected area keeps its tests and passes
        if: always()
        run: python -m omni_prod.agent_os.meta regression pytest-report.xml
      - name: Capability auditor (agent 47) -- no registry inflation
        run: python -m omni_prod.agent_os.audit
      - run: python scripts/run_hostile_static_suite.py
      - run: python scripts/run_international_gate.py
  publish-report:
    # smoke/ci-last-run.md: the latest main CI result, readable without job logs.
    # main pushes only; the commit carries [skip ci] so it never re-triggers CI.
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # This job pushes the report, so its checkout keeps credentials
      # (the test jobs keep persist-credentials: false and a read-only token).
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: report
        continue-on-error: true
      - name: Write smoke/ci-last-run.md
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p smoke
          python - <<'PY'
          import os, collections, datetime, xml.etree.ElementTree as ET
          path = 'report/pytest-report.xml'
          lines = [f"# v24-ci — last main run ({datetime.datetime.now(datetime.timezone.utc):%Y-%m-%dT%H:%M:%SZ})", '',
                   f"- commit: `{os.environ['COMMIT']}`",
                   f"- run_id: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) (attempt {os.environ['RUN_ATTEMPT']})",
                   f"- test job: **{os.environ['TEST_RESULT'].upper()}**"]
          if not os.path.exists(path):
              lines += ['', 'No pytest report was produced (the run failed before pytest finished).']
          else:
              per = collections.defaultdict(lambda: collections.Counter()); failed = []
              for c in ET.parse(path).getroot().iter('testcase'):
                  mod = (c.get('classname') or '').split('.')[1] if '.' in (c.get('classname') or '') else (c.get('classname') or '?')
                  kind = 'fail' if (c.find('failure') is not None or c.find('error') is not None) else ('skip' if c.find('skipped') is not None else 'pass')
                  per[mod][kind] += 1
                  if kind == 'fail':
                      failed.append(f"{c.get('classname')}.{c.get('name')}")
              tot = sum((v for v in per.values()), collections.Counter())
              verdict = 'PASS' if not failed else 'FAIL'
              acc = [n for n in failed if 'AcceptanceW' in n]
              seen = any('AcceptanceW' in (c.get('classname') or '') for c in ET.parse(path).getroot().iter('testcase'))
              lines += [f"- tests: **{verdict}** — {tot['pass']} passed, {tot['fail']} failed, {tot['skip']} skipped",
                        f"- AcceptanceW: **{'FAIL' if acc else ('PASS' if seen else 'NOT RUN')}**", '',
                        '## Failing tests', '']
              lines += [f"- FAIL `{n}`" for n in failed] or ['- none']
              # CostClass behavioural proofs: each named test reported on its own.
              # (test module, test name) -> PASS / FAIL / SKIPPED / NOT FOUND.
              proofs = [
                  ('test_m5_plan_build_class', 'test_amateur_costs_less_than_studio_for_the_same_task'),
                  ('test_worker_budget_binding', 'test_pro_keeps_its_class_budget_when_worker_env_is_lower'),
                  ('test_m5_plan_build_class', 'test_pro_and_studio_get_different_allowlists'),
                  ('test_m5_plan_build_class', 'test_margin_holds_on_every_paid_tier_in_the_worst_case'),
              ]
              all_cases = list(ET.parse(path).getroot().iter('testcase'))
              lines += ['', '## CostClass behavioural proofs', '']
              for pmod, pname in proofs:
                  hits = [c for c in all_cases if c.get('name') == pname and pmod in (c.get('classname') or '')]
                  if not hits:
                      state = 'NOT FOUND'
                  elif any(h.find('failure') is not None or h.find('error') is not None for h in hits):
                      state = 'FAIL'
                  elif all(h.find('skipped') is not None for h in hits):
                      state = 'SKIPPED'
                  else:
                      state = 'PASS'
                  lines.append(f"- `{pmod}::{pname}`: **{state}**")
              lines += ['', '## Per module', '', '| module | PASS/FAIL | passed | failed | skipped |', '|---|---|---|---|---|']
              for m in sorted(per):
                  v = per[m]
                  lines.append(f"| `{m}` | {'FAIL' if v['fail'] else 'PASS'} | {v['pass']} | {v['fail']} | {v['skip']} |")
          lines += ['', '_Test names and counts only; failure messages are not published._']
          open('smoke/ci-last-run.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: Commit [skip ci]
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@148ai.dev"
          git add smoke/ci-last-run.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "chore: v24-ci results [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error title=publish-report::could not push smoke/ci-last-run.md"; exit 1
  compose-config:
    runs-on: ubuntu-latest
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.international.yml config >/dev/null
  customer-ui:
    runs-on: ubuntu-latest
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Parse-check browser scripts before downloading Chromium
        run: |
          node --check omni_prod/assets/app.js
          node --check omni_prod/assets/visual-edit.js
          node --check tests/customer_flow_browser.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/customer_flow_browser.cjs
