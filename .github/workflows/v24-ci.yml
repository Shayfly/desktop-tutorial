name: v24-ci
on:
  pull_request:
  push:
    branches: [main, milestone/pre-staging-2026-10-05]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Classify changed files (unknown diffs run heavy checks)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_scope.py
  light:
    # The cheap checks that prevent the expensive ones (the owner, 2026-11-15 22:50 / 23:41): every push, drafts too.
    # The fast suite (budget 30 s, a failure past it), every deleted line declared, every changed JSON parses, no
    # conflict marker left. A PR that deletes a line without a SIGNED declaration fails HERE (the owner, 2026-11-16:
    # "without this the declarations are documentation, not protection; only a signed declaration releases").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Fast suite (tests/fast_suite.txt)
        run: scripts/test_fast.sh
      - name: Every deleted line is declared and signed (scripts/deletions_declared.py)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          anchor="$(python3 scripts/deletions_declared.py --anchor "${PR_BASE:-}")"
          if ! git cat-file -e "${anchor}^{commit}" 2>/dev/null; then
            echo "::error title=anchor missing::commit $anchor is not in this clone; nothing was compared"; exit 1
          fi
          echo "::notice title=light::deletions measured from ${anchor:0:7}"
          python3 scripts/deletions_declared.py "$anchor"
      - name: Changed JSON parses and no conflict marker is left
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          anchor="$(python3 scripts/deletions_declared.py --anchor "${PR_BASE:-}")"
          python3 scripts/changed_files_sane.py "$anchor"
  test:
    runs-on: ubuntu-latest
    # 15 -> 20 (2026-11-11), the CI-cost policy maximum (tests/test_ci_workflow_concurrency.py): successful runs on
    # main took 12.7-14.9 min and PR #297 was cancelled at exactly 15:00. The real fix is the follow-up: move the
    # UI negative controls to their own job so this one shrinks back.
    timeout-minutes: 20
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - run: python -m compileall -q omni_prod tests
      - run: python -m pytest -q --junitxml=pytest-report.xml
        env:
          OMNI_EVIDENCE_NOTICES: ${{ github.workspace }}/evidence-notices.txt
      - name: Evidence notices (readable as check-run annotations, no log access needed)
        if: always()
        run: cat evidence-notices.txt 2>/dev/null || echo "no evidence notices were written"
      - name: Keep the test report for the published summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publish failing tests as annotations
        if: failure()
        # Job logs are not reachable from every review environment; annotations are.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('pytest-report.xml').getroot().iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  msg = (bad.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title={name}::{msg}")
          PY
      - name: Regression guardian (agent 48) -- every protected area keeps its tests and passes
        if: always()
        run: python -m omni_prod.agent_os.meta regression pytest-report.xml
      - name: Capability auditor (agent 47) -- no registry inflation
        run: python -m omni_prod.agent_os.audit
      - run: python scripts/run_hostile_static_suite.py
      - name: International gate (reads the pytest report above instead of running the suite a second time)
        run: python scripts/run_international_gate.py
        env:
          OMNI_PYTEST_REPORT: pytest-report.xml
  # 2026-11-17: the negative controls ran inside `test`, after pytest, and the two together passed the job's 20-minute
  # policy limit on #426 (pytest 8.5 min + controls over 11 min; `test` was cancelled, no test had failed). This is
  # the follow-up the comment on `test` asked for: the controls run in their own job, beside the tests. Every spec
  # still runs on every push; nothing is skipped.
  negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Negative controls (one SPEC ::notice per spec; per-control NC-EVIDENCE log lines; ::error on FAIL)
        timeout-minutes: 18
        env:
          NC_JOBS: "4"    # 2026-11-17: the 4 cores of the runner; output is the same as a serial run, in the same order
        run: python scripts/run_negative_controls.py
  publish-report:
    # smoke/ci-last-run.md (the latest main CI result, readable without job logs) is published where it cannot rot
    # (2026-11-21, #146): in the run's summary and as the artifact `ci-last-run`. It used to be force-pushed to the
    # ci/v24-report branch with a PR set to auto-merge. That PR (#146) stayed open from 2026-10-26: every report
    # rewrites the file, so the additive-only check (`light`) failed it on every push, and auto-merge stands against
    # CLAUDE.md section 2.5 (no auto-merge in place of approval). Now nothing is pushed and nothing waits to merge: the job
    # only reads (contents: read), and the file is no longer kept in the repository.
    needs: test
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The report job only reads, like the test jobs: no credentials are kept.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          name: pytest-report
          path: report
        continue-on-error: true
      - name: Write the report (run summary and artifact)
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p report
          python - <<'PY'
          import os, collections, datetime, xml.etree.ElementTree as ET
          path = 'report/pytest-report.xml'
          lines = [f"# v24-ci — last main run ({datetime.datetime.now(datetime.timezone.utc):%Y-%m-%dT%H:%M:%SZ})", '',
                   f"- commit: `{os.environ['COMMIT']}`",
                   f"- run_id: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) (attempt {os.environ['RUN_ATTEMPT']})",
                   f"- test job: **{os.environ['TEST_RESULT'].upper()}**"]
          if not os.path.exists(path):
              lines += ['', 'No pytest report was produced (the run failed before pytest finished).']
          else:
              per = collections.defaultdict(lambda: collections.Counter()); failed = []
              for c in ET.parse(path).getroot().iter('testcase'):
                  mod = (c.get('classname') or '').split('.')[1] if '.' in (c.get('classname') or '') else (c.get('classname') or '?')
                  kind = 'fail' if (c.find('failure') is not None or c.find('error') is not None) else ('skip' if c.find('skipped') is not None else 'pass')
                  per[mod][kind] += 1
                  if kind == 'fail':
                      failed.append(f"{c.get('classname')}.{c.get('name')}")
              tot = sum((v for v in per.values()), collections.Counter())
              verdict = 'PASS' if not failed else 'FAIL'
              acc = [n for n in failed if 'AcceptanceW' in n]
              seen = any('AcceptanceW' in (c.get('classname') or '') for c in ET.parse(path).getroot().iter('testcase'))
              lines += [f"- tests: **{verdict}** — {tot['pass']} passed, {tot['fail']} failed, {tot['skip']} skipped",
                        f"- AcceptanceW: **{'FAIL' if acc else ('PASS' if seen else 'NOT RUN')}**", '',
                        '## Failing tests', '']
              lines += [f"- FAIL `{n}`" for n in failed] or ['- none']
              # CostClass behavioural proofs: each named test reported on its own.
              # (test module, test name) -> PASS / FAIL / SKIPPED / NOT FOUND.
              proofs = [
                  ('test_m5_plan_build_class', 'test_amateur_costs_less_than_studio_for_the_same_task'),
                  ('test_worker_budget_binding', 'test_pro_keeps_its_class_budget_when_worker_env_is_lower'),
                  ('test_m5_plan_build_class', 'test_pro_and_studio_get_different_allowlists'),
                  ('test_m5_plan_build_class', 'test_margin_holds_on_every_paid_tier_in_the_worst_case'),
              ]
              all_cases = list(ET.parse(path).getroot().iter('testcase'))
              lines += ['', '## CostClass behavioural proofs', '']
              for pmod, pname in proofs:
                  hits = [c for c in all_cases if c.get('name') == pname and pmod in (c.get('classname') or '')]
                  if not hits:
                      state = 'NOT FOUND'
                  elif any(h.find('failure') is not None or h.find('error') is not None for h in hits):
                      state = 'FAIL'
                  elif all(h.find('skipped') is not None for h in hits):
                      state = 'SKIPPED'
                  else:
                      state = 'PASS'
                  lines.append(f"- `{pmod}::{pname}`: **{state}**")
              lines += ['', '## Per module', '', '| module | PASS/FAIL | passed | failed | skipped |', '|---|---|---|---|---|']
              for m in sorted(per):
                  v = per[m]
                  lines.append(f"| `{m}` | {'FAIL' if v['fail'] else 'PASS'} | {v['pass']} | {v['fail']} | {v['skip']} |")
          lines += ['', '_Test names and counts only; failure messages are not published._']
          text = '\n'.join(lines) + '\n'
          open('report/ci-last-run.md', 'w', encoding='utf-8').write(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(text)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: ci-last-run
          path: report/ci-last-run.md
          retention-days: 30
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.international.yml config >/dev/null
  browser-tests:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with: {node-version: "22"}
      - name: Parse-check browser scripts before downloading Chromium
        run: |
          node --check omni_prod/assets/app.js
          node --check omni_prod/assets/visual-edit.js
          node --check tests/customer_flow_browser.cjs
          node --check tests/preview_frame_browser.cjs
          node --check tests/project_scope_browser.cjs
          node --check tests/approval_one_truth_browser.cjs
          node --check tests/platform_a11y_browser.cjs
          node --check tests/workspace_review_fixes_browser.cjs
          node --check tests/platform_for_everyone_browser.cjs
          node --check tests/ui_languages_browser.cjs
      # axe-core: the WCAG engine of the platform accessibility check (the owner, 2026-11-22: accessible to everyone)
      - run: npm install --no-save --package-lock=false playwright@1.62.1 axe-core@4.10.3
      # 2026-10-27: `playwright install --with-deps` hung for the whole 5-minute step on 2 of the last ~15 runs
      # (normally ~22s), which skipped the browser tests and failed customer-ui without testing anything. The
      # browser download is cached per Playwright version; every attempt (download + apt deps) is bounded and
      # retried, and three failures still fail the job loudly -- never a skipped test reported as fine.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.62.1-chromium
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          # 2026-11-18 (#449, run 44259745208): attempt 1 hit its bound on a slow apt mirror (117 kB/s), but its
          # apt-get child lived on and kept the dpkg lock, so attempts 2 and 3 failed at once on "Could not get
          # lock /var/lib/dpkg/lock-frontend". apt now WAITS for the lock (bounded, inside one attempt) instead of
          # failing, so a retry picks up after the stalled install instead of dying on its lock.
          echo 'DPkg::Lock::Timeout "150";' | sudo tee /etc/apt/apt.conf.d/90-wait-for-dpkg-lock >/dev/null
          for attempt in 1 2 3; do
            if timeout 160 npx playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; browser tests cannot run"
          exit 1
      - run: node tests/customer_flow_browser.cjs
        timeout-minutes: 5
      - run: node tests/preview_frame_browser.cjs
        timeout-minutes: 3
      - run: node tests/project_scope_browser.cjs
        timeout-minutes: 3
      - run: node tests/approval_one_truth_browser.cjs
        timeout-minutes: 3
      # WCAG 2.2 AA on every platform screen, in every UI language, at 320/390/1440 px; it also proves it catches
      # seven deliberate faults on every run (tests/platform_a11y_browser.cjs)
      - run: node tests/platform_a11y_browser.cjs
        timeout-minutes: 8
      # the platform design's review fixes (F1 preview after a failed rebuild, F2 project status, F3 who said what,
      # F5 a late reply in another project); each scenario also fails with its fix taken out
      - run: node tests/workspace_review_fixes_browser.cjs
        timeout-minutes: 4
      # usable by anyone who can read (the owner, 2026-11-22): no name asked before the first message, zero technical
      # terms, reading text 16px+, every control 44px+, three text sizes, the owner's example look (open dark rail, dark top
      # bar); it also proves it catches nine deliberate faults
      - run: node tests/platform_for_everyone_browser.cjs
        timeout-minutes: 6
      # every platform language whole: no key falls back, no text in another script, the picker switches
      - run: node tests/ui_languages_browser.cjs
        timeout-minutes: 3
  customer-ui:
    # Preserve the required check name and fail closed if classification fails.
    needs: [changes, browser-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require browser success or an explicit documentation-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          TEST_RESULT: ${{ needs.browser-tests.result }}
        run: python scripts/ci_scope.py --verify-gate
