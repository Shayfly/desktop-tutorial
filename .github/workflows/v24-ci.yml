name: v24-ci
on:
  pull_request:
  push:
    branches: [main, milestone/pre-staging-2026-10-05]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify changed files (unknown diffs run heavy checks)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_scope.py
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - run: python -m compileall -q omni_prod tests
      - run: python -m pytest -q --junitxml=pytest-report.xml
        env:
          OMNI_EVIDENCE_NOTICES: ${{ github.workspace }}/evidence-notices.txt
      - name: Evidence notices (readable as check-run annotations, no log access needed)
        if: always()
        run: cat evidence-notices.txt 2>/dev/null || echo "no evidence notices were written"
      - name: Negative controls (one SPEC ::notice per spec; per-control NC-EVIDENCE log lines; ::error on FAIL)
        if: always()
        timeout-minutes: 20
        run: python scripts/run_negative_controls.py
      - name: Keep the test report for the published summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publish failing tests as annotations
        if: failure()
        # Job logs are not reachable from every review environment; annotations are.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('pytest-report.xml').getroot().iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  msg = (bad.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title={name}::{msg}")
          PY
      - name: Regression guardian (agent 48) -- every protected area keeps its tests and passes
        if: always()
        run: python -m omni_prod.agent_os.meta regression pytest-report.xml
      - name: Capability auditor (agent 47) -- no registry inflation
        run: python -m omni_prod.agent_os.audit
      - run: python scripts/run_hostile_static_suite.py
      - run: python scripts/run_international_gate.py
  publish-report:
    # smoke/ci-last-run.md: the latest main CI result, readable without job logs.
    # main pushes only. The bot never pushes to main: the report goes to the
    # ci/v24-report branch and a PR, which main's protection reviews/merges like
    # any other, and auto-merges (squash) when its requirements are met. The
    # condition stays refs/heads/main on purpose: that is the run whose result is being reported; the branch push is a different ref, so it
    # never re-enters this job. The merged report commit lands on main again, so
    # the message guard below stops that push from opening another report PR.
    needs: test
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && !startsWith(github.event.head_commit.message, 'chore: v24-ci results')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write        # push the ci/v24-report branch (never main)
      pull-requests: write   # open the report PR
      actions: write         # dispatch the required checks on the report branch (see "on:")
    steps:
      # This job pushes the report, so its checkout keeps credentials
      # (the test jobs keep persist-credentials: false and a read-only token).
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: report
        continue-on-error: true
      - name: Write smoke/ci-last-run.md
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p smoke
          python - <<'PY'
          import os, collections, datetime, xml.etree.ElementTree as ET
          path = 'report/pytest-report.xml'
          lines = [f"# v24-ci — last main run ({datetime.datetime.now(datetime.timezone.utc):%Y-%m-%dT%H:%M:%SZ})", '',
                   f"- commit: `{os.environ['COMMIT']}`",
                   f"- run_id: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) (attempt {os.environ['RUN_ATTEMPT']})",
                   f"- test job: **{os.environ['TEST_RESULT'].upper()}**"]
          if not os.path.exists(path):
              lines += ['', 'No pytest report was produced (the run failed before pytest finished).']
          else:
              per = collections.defaultdict(lambda: collections.Counter()); failed = []
              for c in ET.parse(path).getroot().iter('testcase'):
                  mod = (c.get('classname') or '').split('.')[1] if '.' in (c.get('classname') or '') else (c.get('classname') or '?')
                  kind = 'fail' if (c.find('failure') is not None or c.find('error') is not None) else ('skip' if c.find('skipped') is not None else 'pass')
                  per[mod][kind] += 1
                  if kind == 'fail':
                      failed.append(f"{c.get('classname')}.{c.get('name')}")
              tot = sum((v for v in per.values()), collections.Counter())
              verdict = 'PASS' if not failed else 'FAIL'
              acc = [n for n in failed if 'AcceptanceW' in n]
              seen = any('AcceptanceW' in (c.get('classname') or '') for c in ET.parse(path).getroot().iter('testcase'))
              lines += [f"- tests: **{verdict}** — {tot['pass']} passed, {tot['fail']} failed, {tot['skip']} skipped",
                        f"- AcceptanceW: **{'FAIL' if acc else ('PASS' if seen else 'NOT RUN')}**", '',
                        '## Failing tests', '']
              lines += [f"- FAIL `{n}`" for n in failed] or ['- none']
              # CostClass behavioural proofs: each named test reported on its own.
              # (test module, test name) -> PASS / FAIL / SKIPPED / NOT FOUND.
              proofs = [
                  ('test_m5_plan_build_class', 'test_amateur_costs_less_than_studio_for_the_same_task'),
                  ('test_worker_budget_binding', 'test_pro_keeps_its_class_budget_when_worker_env_is_lower'),
                  ('test_m5_plan_build_class', 'test_pro_and_studio_get_different_allowlists'),
                  ('test_m5_plan_build_class', 'test_margin_holds_on_every_paid_tier_in_the_worst_case'),
              ]
              all_cases = list(ET.parse(path).getroot().iter('testcase'))
              lines += ['', '## CostClass behavioural proofs', '']
              for pmod, pname in proofs:
                  hits = [c for c in all_cases if c.get('name') == pname and pmod in (c.get('classname') or '')]
                  if not hits:
                      state = 'NOT FOUND'
                  elif any(h.find('failure') is not None or h.find('error') is not None for h in hits):
                      state = 'FAIL'
                  elif all(h.find('skipped') is not None for h in hits):
                      state = 'SKIPPED'
                  else:
                      state = 'PASS'
                  lines.append(f"- `{pmod}::{pname}`: **{state}**")
              lines += ['', '## Per module', '', '| module | PASS/FAIL | passed | failed | skipped |', '|---|---|---|---|---|']
              for m in sorted(per):
                  v = per[m]
                  lines.append(f"| `{m}` | {'FAIL' if v['fail'] else 'PASS'} | {v['pass']} | {v['fail']} | {v['skip']} |")
          lines += ['', '_Test names and counts only; failure messages are not published._']
          open('smoke/ci-last-run.md', 'w', encoding='utf-8').write('\n'.join(lines) + '\n')
          PY
      - name: Commit the report to a branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_BRANCH: ci/v24-report
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@148ai.dev"
          git add smoke/ci-last-run.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git checkout -b "$REPORT_BRANCH"
          git commit -m "chore: v24-ci results"
          # Bot-owned branch; each report supersedes the previous one. main is never touched.
          git push --force origin "HEAD:refs/heads/$REPORT_BRANCH"
          PR="$(gh pr list --head "$REPORT_BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$PR" ]; then
            gh pr create --base main --head "$REPORT_BRANCH" \
              --title "chore: v24-ci results" \
              --body "Automated CI result report (smoke/ci-last-run.md). Auto-merges (squash) once main's protection is satisfied."
            PR="$(gh pr list --head "$REPORT_BRANCH" --base main --state open --json number --jq '.[0].number')"
          fi
          # The required checks must RUN on the report commit (GITHUB_TOKEN events start no workflow): dispatch both.
          gh workflow run v24-ci.yml --ref "$REPORT_BRANCH"
          gh workflow run v11-overlay-ci.yml --ref "$REPORT_BRANCH"
          echo "::notice title=publish-report::report PR #$PR on $REPORT_BRANCH @ $(git rev-parse --short HEAD); test and validate dispatched on it"
          # Auto-merge waits for main's required checks/reviews; it never bypasses them.
          # The squash subject keeps the 'chore: v24-ci results' prefix the job guard relies on.
          gh pr merge "$PR" --auto --squash --subject "chore: v24-ci results" \
            || echo "::warning title=publish-report::auto-merge not enabled on PR #$PR (repo setting 'Allow auto-merge' or main protection missing); it needs a manual merge"
  compose-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.international.yml config >/dev/null
  browser-tests:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Parse-check browser scripts before downloading Chromium
        run: |
          node --check omni_prod/assets/app.js
          node --check omni_prod/assets/visual-edit.js
          node --check tests/customer_flow_browser.cjs
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      # 2026-10-27: `playwright install --with-deps` hung for the whole 5-minute step on 2 of the last ~15 runs
      # (normally ~22s), which skipped the browser tests and failed customer-ui without testing anything. The
      # browser download is cached per Playwright version; every attempt (download + apt deps) is bounded and
      # retried, and three failures still fail the job loudly -- never a skipped test reported as fine.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-1.62.1-chromium
      - name: Install Chromium (bounded attempts, retried)
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            if timeout 160 npx playwright install --with-deps chromium; then
              echo "playwright install: ok on attempt $attempt"; exit 0
            fi
            echo "::warning title=playwright install::attempt $attempt failed or hung (160s); retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=playwright install::failed 3 times; browser tests cannot run"
          exit 1
      - run: node tests/customer_flow_browser.cjs
        timeout-minutes: 5
  customer-ui:
    # Preserve the required check name and fail closed if classification fails.
    needs: [changes, browser-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Require browser success or an explicit documentation-only skip
        env:
          SCOPE_RESULT: ${{ needs.changes.result }}
          HEAVY: ${{ needs.changes.outputs.heavy }}
          TEST_RESULT: ${{ needs.browser-tests.result }}
        run: python scripts/ci_scope.py --verify-gate
