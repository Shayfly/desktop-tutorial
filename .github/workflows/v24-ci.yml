name: v24-ci
on:
  pull_request:
  push:
    branches: [main, milestone/pre-staging-2026-10-05]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify changed files (unknown diffs run heavy checks)
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/ci_scope.py
  light:
    # The cheap checks that prevent the expensive ones (the owner, 2026-11-15 22:50 / 23:41): every push, drafts too.
    # The fast suite (budget 30 s, a failure past it), every deleted line declared, every changed JSON parses, no
    # conflict marker left. A PR that deletes a line without a SIGNED declaration fails HERE (the owner, 2026-11-16:
    # "without this the declarations are documentation, not protection; only a signed declaration releases").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Fast suite (tests/fast_suite.txt)
        run: scripts/test_fast.sh
      - name: Every deleted line is declared and signed (scripts/deletions_declared.py)
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          anchor="$(python3 scripts/deletions_declared.py --anchor "${PR_BASE:-}")"
          if ! git cat-file -e "${anchor}^{commit}" 2>/dev/null; then
            echo "::error title=anchor missing::commit $anchor is not in this clone; nothing was compared"; exit 1
          fi
          echo "::notice title=light::deletions measured from ${anchor:0:7}"
          python3 scripts/deletions_declared.py "$anchor"
      - name: Changed JSON parses and no conflict marker is left
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          anchor="$(python3 scripts/deletions_declared.py --anchor "${PR_BASE:-}")"
          python3 scripts/changed_files_sane.py "$anchor"
  test:
    runs-on: ubuntu-latest
    # 15 -> 20 (2026-11-11), the CI-cost policy maximum (tests/test_ci_workflow_concurrency.py): successful runs on
    # main took 12.7-14.9 min and PR #297 was cancelled at exactly 15:00. The real fix is the follow-up: move the
    # UI negative controls to their own job so this one shrinks back.
    timeout-minutes: 20
    steps:
      # Audited registry snapshots refer to the PR HEAD, not GitHub's
      # synthetic merge SHA, which can include unrelated base-branch changes.
      # Merge compatibility still requires a separately verified merge gate.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - run: python -m compileall -q omni_prod tests
      - run: python -m pytest -q --junitxml=pytest-report.xml
        env:
          OMNI_EVIDENCE_NOTICES: ${{ github.workspace }}/evidence-notices.txt
      - name: Evidence notices (readable as check-run annotations, no log access needed)
        if: always()
        run: cat evidence-notices.txt 2>/dev/null || echo "no evidence notices were written"
      - name: Keep the test report for the published summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Publish failing tests as annotations
        if: failure()
        # Job logs are not reachable from every review environment; annotations are.
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          for case in ET.parse('pytest-report.xml').getroot().iter('testcase'):
              for bad in list(case.iter('failure')) + list(case.iter('error')):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  msg = (bad.get('message') or '').replace('\n', ' ')[:300]
                  print(f"::error title={name}::{msg}")
          PY
      - name: Regression guardian (agent 48) -- every protected area keeps its tests and passes
        if: always()
        run: python -m omni_prod.agent_os.meta regression pytest-report.xml
      - name: Capability auditor (agent 47) -- no registry inflation
        run: python -m omni_prod.agent_os.audit
      - run: python scripts/run_hostile_static_suite.py
      - name: International gate (reads the pytest report above instead of running the suite a second time)
        run: python scripts/run_international_gate.py
        env:
          OMNI_PYTEST_REPORT: pytest-report.xml
  # 2026-11-17: the negative controls ran inside `test`, after pytest, and the two together passed the job's 20-minute
  # policy limit on #426 (pytest 8.5 min + controls over 11 min; `test` was cancelled, no test had failed). This is
  # the follow-up the comment on `test` asked for: the controls run in their own job, beside the tests. Every spec
  # still runs on every push; nothing is skipped.
  negative-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r requirements-production.txt -r requirements-test.txt
      - name: Negative controls (one SPEC ::notice per spec; per-control NC-EVIDENCE log lines; ::error on FAIL)
        timeout-minutes: 18
        env:
          NC_JOBS: "4"    # 2026-11-17: the 4 cores of the runner; output is the same as a serial run, in the same order
        run: python scripts/run_negative_controls.py
  publish-report:
    # Reports are evidence of the run, never a source-code change.
    # The summary and artifact remain available even when the test job fails.
    needs: test
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pytest-report
          path: report
        continue-on-error: true
      - name: Render report to job summary and artifact file
        env:
          TEST_RESULT: ${{ needs.test.result }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p report-output
          python - <<'PY'
          import collections
          import datetime
          import os
          import xml.etree.ElementTree as ET
          lines = [
              f"# v24-ci — main run ({datetime.datetime.now(datetime.timezone.utc):%Y-%m-%dT%H:%M:%SZ})",
              "",
              f"- commit: \`{os.environ['COMMIT']}\`",
              f"- run: [{os.environ['RUN_ID']}]({os.environ['RUN_URL']}) (attempt {os.environ['RUN_ATTEMPT']})",
              f"- test job: **{os.environ['TEST_RESULT'].upper()}**",
          ]
          path = "report/pytest-report.xml"
          if not os.path.exists(path):
              lines += ["", "**NOT RUN** — pytest-report.xml was not produced; inspect the test job."]
          else:
              cases = list(ET.parse(path).getroot().iter("testcase"))
              failed = [
                  f"{c.get('classname')}.{c.get('name')}"
                  for c in cases if c.find("failure") is not None or c.find("error") is not None
              ]
              skipped = sum(c.find("skipped") is not None for c in cases)
              lines += [
                  "",
                  f"- tests: **{'FAIL' if failed else 'PASS'}** — {len(cases)-len(failed)-skipped} passed, {len(failed)} failed, {skipped} skipped",
                  "- AcceptanceW: **" + (
                      "FAIL" if any("AcceptanceW" in n for n in failed)
                      else "PASS" if any("AcceptanceW" in (c.get("classname") or "") for c in cases)
                      else "NOT RUN"
                  ) + "**",
                  "",
                  "## Failing tests",
                  *([f"- FAIL \`{n}\`" for n in failed] or ["- none"]),
              ]
          lines += ["", "_Evidence is scoped to this run and commit; no repository file is updated._"]
          report = "\\n".join(lines) + "\\n"
          with open("report-output/v24-ci-report.md", "w", encoding="utf-8") as out:
              out.write(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write(report)
          PY
      - name: Upload report as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v24-ci-summary
          path: report-output/v24-ci-report.md
          if-no-files-found: error
          retention-days: 90
