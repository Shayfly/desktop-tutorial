name: 148AI V28 Verify
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: pip install -r requirements.txt pytest httpx
      - name: Validate packaged runtime
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          p=Path("omni_prod_runtime.zip")
          assert p.is_file() and p.stat().st_size > 100000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=set(z.namelist())
              assert "omni_prod/investor_app.py" in names
              assert "omni_prod/v28_platform.py" in names
          print("runtime zip OK", p.stat().st_size)
          PY
      - name: Python compile
        run: python -m py_compile app.py
      - name: Browser JavaScript syntax
        run: node --check ui/app.js
      - name: Bootstrap and customer UI smoke
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import app
          c=TestClient(app.app)
          r=c.get("/")
          assert r.status_code==200
          assert "148AI" in r.text and "Create free account" in r.text
          h=c.get("/_148ai/health")
          assert h.status_code==200 and h.json()["runtime_loaded"] is True, h.text
          s=c.get("/api/status")
          assert s.status_code==200 and s.json()["product"]=="148AI", s.text
          print("bootstrap + runtime API OK")
          PY
