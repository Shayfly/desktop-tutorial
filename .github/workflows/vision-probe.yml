name: Vision probe
# Michael 2026-11-15: vision first, then the live probe (Shai approved its cost, a few cents). Runs on the worker host,
# which holds the real model catalog (OMNI_MODEL_CATALOG_JSON) and the provider keys, and sends every catalog model two
# known pictures (omni_prod/vision_probe.py: 2 calls per model). Manual only. Each result line is its own annotation;
# a model routed for images (omni_prod/vision_models.py) that fails ends the run red -- a calibration finding.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vision-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: [self-hosted, omni-worker]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Write environment file
        env:
          WORKER_ENV: ${{ secrets.WORKER_ENV }}
          WORKER_ENV_OVERRIDES: ${{ secrets.WORKER_ENV_OVERRIDES }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VENICE_API_KEY1: ${{ secrets.VENICE_API_KEY1 }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          OMNI_DATABASE_URL: ${{ secrets.OMNI_DATABASE_URL }}
          OMNI_REDIS_URL: ${{ secrets.OMNI_REDIS_URL }}
        run: bash infra/worker-host/write-env.sh
      - name: Probe
        working-directory: infra/worker-host
        run: |
          set -uo pipefail
          rc=0
          docker compose run --rm --no-deps -T worker python -m omni_prod.vision_probe > out.txt 2> err.txt || rc=$?
          grep '^::' out.txt || true
          grep -v '^::' out.txt | grep -v '^VISION_PROBE_JSON ' || true
          grep '^VISION_PROBE_JSON ' out.txt | cut -d' ' -f2- > probe.json || true
          # an empty err.txt makes grep -v exit 1; under pipefail that ended the step red with every model PASS (run 43657047045)
          { tr -d '\r' < err.txt | grep -v '^[[:space:]]*$' | tail -n 5 | while IFS= read -r l; do echo "::warning title=vision probe stderr::$l"; done; } || true
          echo "::notice title=vision probe exit::$rc"
          exit $rc
      - name: Keep the answers
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vision-probe
          path: infra/worker-host/probe.json
          if-no-files-found: error
