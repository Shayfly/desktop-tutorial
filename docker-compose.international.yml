services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: omni
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes: [omni_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory-policy","noeviction"]
    volumes: [omni_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OMNI_S3_ACCESS_KEY:?set OMNI_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${OMNI_S3_SECRET_KEY:?set OMNI_S3_SECRET_KEY}
    volumes: [omni_objects:/data]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh","-c"]
    command: ["mc alias set local http://minio:9000 $$OMNI_S3_ACCESS_KEY $$OMNI_S3_SECRET_KEY && mc mb --ignore-existing local/$$OMNI_S3_BUCKET"]
    environment:
      OMNI_S3_ACCESS_KEY: ${OMNI_S3_ACCESS_KEY:?set OMNI_S3_ACCESS_KEY}
      OMNI_S3_SECRET_KEY: ${OMNI_S3_SECRET_KEY:?set OMNI_S3_SECRET_KEY}
      OMNI_S3_BUCKET: ${OMNI_S3_BUCKET:-omni-artifacts}
    networks: [backend]

  sandbox-runner:
    build:
      context: .
      dockerfile: infra/sandbox-runner/Dockerfile
    restart: unless-stopped
    environment:
      OMNI_SANDBOX_SHARED_SECRET: ${OMNI_SANDBOX_SHARED_SECRET:?set OMNI_SANDBOX_SHARED_SECRET}
      OMNI_SANDBOX_IMAGE: ${OMNI_SANDBOX_IMAGE:-omni-sandbox:latest}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [backend]
    # Staging convenience only. For production deploy this runner on a dedicated isolated node/runtime.

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      OMNI_DATABASE_URL: ${OMNI_DATABASE_URL:?set OMNI_DATABASE_URL}
      OMNI_REDIS_URL: redis://redis:6379/0
      OMNI_S3_ENDPOINT: http://minio:9000
      OMNI_SANDBOX_RUNNER_URL: http://sandbox-runner:8010
      OMNI_LOCAL_MODEL_URL: ${OMNI_LOCAL_MODEL_URL:-http://model:8000/v1}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      sandbox-runner: {condition: service_started}
    networks: [backend]

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python","-m","omni_prod.worker"]
    environment:
      OMNI_DATABASE_URL: ${OMNI_DATABASE_URL:?set OMNI_DATABASE_URL}
      OMNI_REDIS_URL: redis://redis:6379/0
      OMNI_S3_ENDPOINT: http://minio:9000
      OMNI_SANDBOX_RUNNER_URL: http://sandbox-runner:8010
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [backend]

  model:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    command: ["--model","${OMNI_LOCAL_MODEL_HF_ID:-Qwen/Qwen3-Coder-30B-A3B-Instruct}","--served-model-name","${OMNI_LOCAL_MODEL_ID:-omni-local}","--host","0.0.0.0","--port","8000"]
    gpus: all
    volumes: [model_cache:/root/.cache/huggingface]
    networks: [backend]

networks:
  backend:
    driver: bridge
volumes:
  omni_pg:
  omni_redis:
  omni_objects:
  model_cache:
