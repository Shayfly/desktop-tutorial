# 148AI build worker host (one small VPS).
#
# Runs the RQ build worker and the isolated sandbox runner next to Docker.
# Durable state stays in the managed services (Neon Postgres, Upstash Redis,
# Cloudflare R2); nothing on this host is the source of truth.
#
# The sandbox runner talks to the host Docker daemon (docker-out-of-docker).
# Bind-mount source paths are host paths, so its temp directory is a host
# directory mounted at the identical path. The runner is reachable only on the
# private compose network; no port is published.
name: omni-worker

services:
  sandbox-image:
    # Builds the generated-code execution image used by the runner.
    build:
      context: ../sandbox
    image: omni-sandbox:latest
    entrypoint: ["true"]
    restart: "no"

  sandbox-runner:
    build:
      context: ../..
      dockerfile: infra/sandbox-runner/Dockerfile
    restart: unless-stopped
    environment:
      OMNI_SANDBOX_SHARED_SECRET: ${OMNI_SANDBOX_SHARED_SECRET:?required}
      TMPDIR: /var/lib/omni-sandbox/tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/omni-sandbox:/var/lib/omni-sandbox
    depends_on:
      sandbox-image:
        condition: service_completed_successfully
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8010/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
    restart: unless-stopped
    command: ["python", "-m", "omni_prod.worker"]
    # SIGTERM = RQ warm shutdown: finish the running build/change, take no new one.
    stop_grace_period: 25m
    env_file: .env
    environment:
      OMNI_SANDBOX_RUNNER_URL: http://sandbox-runner:8010
      OMNI_CREATOR_PERSISTENCE: postgres
      OMNI_ENABLE_LIVE_BUILD: "1"
    depends_on:
      sandbox-runner:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      disable: true

  # Running previews (M3). Separate from the build worker so only this
  # orchestrator holds the Docker socket. Host network: preview containers
  # publish on 127.0.0.1 of the host, which the health probe and the router
  # reach directly. The workdir path is identical on host and container so
  # the host daemon can bind-mount it.
  preview-worker:
    build:
      context: ../..
      dockerfile: infra/preview-worker/Dockerfile
    image: omni-preview-worker:latest
    restart: unless-stopped
    command: ["python", "-m", "omni_prod.worker"]
    stop_grace_period: 5m
    env_file: .env
    environment:
      OMNI_CREATOR_PERSISTENCE: postgres
      OMNI_WORKER_QUEUES: omni-previews,omni-preview-host-${OMNI_PREVIEW_RUNTIME_HOST:?required}
      OMNI_PREVIEW_BIND_ADDRESS: 127.0.0.1
      OMNI_PREVIEW_PROBE_HOST: 127.0.0.1
      TMPDIR: /var/lib/omni-preview/tmp
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/omni-preview:/var/lib/omni-preview
    healthcheck:
      disable: true

  preview-router:
    image: omni-preview-worker:latest
    restart: unless-stopped
    command: ["python", "-m", "omni_prod.preview_router"]
    env_file: .env
    network_mode: host
    depends_on: [preview-worker]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8088/_health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Expires previews and removes their containers; releases builds whose
  # worker died (omni_prod.maintenance). Same host/socket/workdir as the
  # preview worker, because it stops the containers that worker started.
  janitor:
    image: omni-preview-worker:latest
    restart: unless-stopped
    command: ["python", "-m", "omni_prod.maintenance"]
    env_file: .env
    environment:
      OMNI_CREATOR_PERSISTENCE: postgres
      TMPDIR: /var/lib/omni-preview/tmp
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/omni-preview:/var/lib/omni-preview
    depends_on: [preview-worker]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      preview-router:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
