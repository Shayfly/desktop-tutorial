<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>השאלת ציוד</title><link rel="stylesheet" href="/static/style.css"></head>
<body>
<header class="top"><h1 class="title">השאלת ציוד לצוות</h1><a href="/edit" class="link">עריכת פריט</a></header>
<main>
  <section class="card">
    <h2>השאלה חדשה</h2>
    <label>שם הפריט <input name="item" placeholder="למשל: מצלמה"></label>
    <label>מי שואל <input name="borrower" placeholder="שם העובד"></label>
    <div class="actions">
      <button id="save-btn" class="btn primary">שמירה</button>
      <button class="btn">ביטול</button>
    </div>
  </section>
  <section class="card">
    <h2>פריטים מושאלים</h2>
    <ul class="list"><li>מצלמה — דנה (עד 14.10)</li><li>מקרן — יוסי (עד 16.10)</li></ul>
  </section>
</main>
</body>
</html>
